<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>BOMIS Conversation</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      width: 90%;
      max-width: 900px;
      margin: 30px auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .row {
      display: flex;
      gap: 15px;
      margin-bottom: 15px;
    }

    .field {
      flex: 1;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin: 25px 0;
    }

    button {
      padding: 13px 28px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #startBtn {
      background: #2e7d32;
      color: white;
    }

    #stopBtn {
      background: #c62828;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      text-align: center;
      font-weight: bold;
      margin: 15px 0;
      min-height: 24px;
    }

    .conversation-title {
      font-size: 18px;
      font-weight: bold;
      margin-top: 25px;
      margin-bottom: 8px;
    }

    #conversationBox {
      width: 100%;
      min-height: 250px;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: #fafafa;
      font-size: 16px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-y: auto;
    }

    #downloadLink {
      display: none;
      text-align: center;
      margin-top: 15px;
    }

    #downloadLink a {
      display: inline-block;
      padding: 10px 18px;
      background: #1565c0;
      color: white;
      text-decoration: none;
      border-radius: 7px;
    }

    #bridgeFrame {
      width: 1px;
      height: 1px;
      border: 0;
      position: absolute;
      left: -9999px;
      top: -9999px;
    }

  </style>

</head>


<body>


<div class="container">

  <h1>
    BOMIS Conversation
  </h1>


  <!-- STUDENT DETAILS -->

  <div class="row">

    <div class="field">

      <label>
        Student Name
      </label>

      <input
        type="text"
        id="studentName"
        placeholder="Enter student name"
      >

    </div>


    <div class="field">

      <label>
        Grade
      </label>

      <select id="grade">

        <option value="">
          Select Grade
        </option>

        <option value="Grade 1">
          Grade 1
        </option>

        <option value="Grade 2">
          Grade 2
        </option>

        <option value="Grade 3">
          Grade 3
        </option>

        <option value="Grade 4">
          Grade 4
        </option>

        <option value="Grade 5">
          Grade 5
        </option>

        <option value="Grade 6">
          Grade 6
        </option>

        <option value="Grade 7">
          Grade 7
        </option>

        <option value="Grade 8">
          Grade 8
        </option>

        <option value="Grade 9">
          Grade 9
        </option>

        <option value="Grade 10">
          Grade 10
        </option>

        <option value="Grade 11">
          Grade 11
        </option>

        <option value="Grade 12">
          Grade 12
        </option>

      </select>

    </div>

  </div>


  <!-- BUTTONS -->

  <div class="buttons">

    <button
      id="startBtn"
      onclick="startRecording()"
    >
      🎙 Start Recording
    </button>


    <button
      id="stopBtn"
      onclick="stopRecording()"
      disabled
    >
      ⏹ Stop
    </button>

  </div>


  <!-- STATUS -->

  <div id="status">
    Ready to record
  </div>


  <!-- CONVERSATION -->

  <div class="conversation-title">
    Conversation
  </div>


  <div id="conversationBox">
    Conversation will appear here...
  </div>


  <!-- DOWNLOAD -->

  <div id="downloadLink">

    <a
      id="downloadAudio"
      href="#"
      download
    >
      ⬇ Download Recording
    </a>

  </div>

</div>


<!-- ==========================================
     HIDDEN APPS SCRIPT BRIDGE
     ========================================== -->

<iframe
  id="bridgeFrame"
  src="https://script.google.com/macros/s/AKfycbzfD-Rd2gNhV-5izmNgAoSrbOpeXeYezZXon961Ece-2RawVq7U8dnJ2W7LUGfvNbgLsA/exec"
  allow="microphone">
</iframe>


<script>


// ==========================================
// GLOBAL VARIABLES
// ==========================================

let mediaRecorder = null;

let audioChunks = [];

let stream = null;

let recordingStartTime = null;


// ==========================================
// ELEMENTS
// ==========================================

const startBtn =
  document.getElementById(
    "startBtn"
  );


const stopBtn =
  document.getElementById(
    "stopBtn"
  );


const status =
  document.getElementById(
    "status"
  );


const conversationBox =
  document.getElementById(
    "conversationBox"
  );


const bridgeFrame =
  document.getElementById(
    "bridgeFrame"
  );


// ==========================================
// START RECORDING
// ==========================================

async function startRecording() {

  const studentName =
    document.getElementById(
      "studentName"
    ).value.trim();


  const grade =
    document.getElementById(
      "grade"
    ).value;


  if (!studentName) {

    alert(
      "Please enter the student name."
    );

    return;
  }


  if (!grade) {

    alert(
      "Please select the grade."
    );

    return;
  }


  try {

    status.textContent =
      "🎙 Requesting microphone...";


    stream =
      await navigator.mediaDevices
        .getUserMedia({
          audio: true
        });


    audioChunks = [];


    // =====================================
    // SELECT RECORDING FORMAT
    // =====================================

    let options = {};

    if (
      MediaRecorder.isTypeSupported(
        "audio/webm;codecs=opus"
      )
    ) {

      options = {
        mimeType:
          "audio/webm;codecs=opus"
      };

    } else {

      options = {
        mimeType:
          "audio/webm"
      };

    }


    mediaRecorder =
      new MediaRecorder(
        stream,
        options
      );


    // =====================================
    // COLLECT AUDIO
    // =====================================

    mediaRecorder.ondataavailable =
      function(event) {

        if (
          event.data &&
          event.data.size > 0
        ) {

          audioChunks.push(
            event.data
          );

        }

      };


    // =====================================
    // RECORDING STOPPED
    // =====================================

    mediaRecorder.onstop =
      async function() {

        console.log(
          "Recording stopped."
        );


        // Stop microphone
        if (stream) {

          stream
            .getTracks()
            .forEach(
              function(track) {
                track.stop();
              }
            );

        }


        const audioBlob =
          new Blob(
            audioChunks,
            {
              type:
                mediaRecorder.mimeType ||
                "audio/webm"
            }
          );


        console.log(
          "Audio size:",
          audioBlob.size
        );


        if (audioBlob.size === 0) {

          status.textContent =
            "❌ No audio was recorded.";

          return;
        }


        // =================================
        // DOWNLOAD AUDIO
        // =================================

        const downloadUrl =
          URL.createObjectURL(
            audioBlob
          );


        const safeName =
          studentName
            .replace(
              /[^a-z0-9]/gi,
              "_"
            );


        const safeGrade =
          grade
            .replace(
              /[^a-z0-9]/gi,
              "_"
            );


        const downloadLink =
          document.getElementById(
            "downloadAudio"
          );


        downloadLink.href =
          downloadUrl;


        downloadLink.download =
          "BOMIS_" +
          safeName +
          "_" +
          safeGrade +
          "_Conversation.webm";


        document.getElementById(
          "downloadLink"
        ).style.display =
          "block";


        // =================================
        // SEND TO APPS SCRIPT
        // =================================

        status.textContent =
          "⏳ Preparing conversation...";


        conversationBox.textContent =
          "⏳ Sending conversation for transcription...";


        try {

          const dataUrl =
            await blobToDataURL(
              audioBlob
            );


          console.log(
            "Data URL created."
          );

          console.log(
            "Data URL length:",
            dataUrl.length
          );


          sendAudioToBridge(
            dataUrl,
            mediaRecorder.mimeType ||
              "audio/webm"
          );


        } catch (error) {

          console.error(
            error
          );


          status.textContent =
            "❌ Could not prepare audio.";


          conversationBox.textContent =
            "Error: " +
            error.message;

        }

      };


    // =====================================
    // START
    // =====================================

    mediaRecorder.start();


    recordingStartTime =
      Date.now();


    startBtn.disabled =
      true;


    stopBtn.disabled =
      false;


    status.textContent =
      "🔴 Recording...";


    conversationBox.textContent =
      "Recording conversation...";


  } catch (error) {

    console.error(
      "Microphone error:",
      error
    );


    status.textContent =
      "❌ Microphone error";


    alert(
      "Microphone could not be accessed.\n\n" +
      error.message
    );

  }

}


// ==========================================
// STOP RECORDING
// ==========================================

function stopRecording() {

  if (
    !mediaRecorder ||
    mediaRecorder.state !==
      "recording"
  ) {

    return;
  }


  status.textContent =
    "⏹ Stopping recording...";


  stopBtn.disabled =
    true;


  mediaRecorder.stop();

}


// ==========================================
// BLOB → DATA URL
// ==========================================

function blobToDataURL(blob) {

  return new Promise(
    function(resolve, reject) {

      const reader =
        new FileReader();


      reader.onloadend =
        function() {

          resolve(
            reader.result
          );

        };


      reader.onerror =
        function(error) {

          reject(
            error
          );

        };


      reader.readAsDataURL(
        blob
      );

    }
  );

}


// ==========================================
// SEND AUDIO TO BRIDGE
// ==========================================

function sendAudioToBridge(
  dataUrl,
  mimeType
) {

  const studentName =
    document.getElementById(
      "studentName"
    ).value.trim();


  const grade =
    document.getElementById(
      "grade"
    ).value;


  const date =
    new Date()
      .toLocaleDateString(
        "en-IN"
      );


  console.log(
    "Sending audio to Bridge..."
  );


  console.log(
    "Student:",
    studentName
  );


  console.log(
    "Grade:",
    grade
  );


  console.log(
    "Audio length:",
    dataUrl.length
  );


  status.textContent =
    "⏳ Sending conversation for transcription...";


  conversationBox.textContent =
    "⏳ Sending conversation for transcription...";


  bridgeFrame.contentWindow.postMessage(

    {

      type:
        "PROCESS_AUDIO",

      audioDataUrl:
        dataUrl,

      mimeType:
        mimeType,

      studentName:
        studentName,

      grade:
        grade,

      date:
        date

    },

    "*"

  );

}


// ==========================================
// RECEIVE MESSAGE FROM BRIDGE
// ==========================================

window.addEventListener(
  "message",
  function(event) {

    console.log(
      "MESSAGE RECEIVED:",
      event.data
    );


    const data =
      event.data;


    if (!data) {
      return;
    }


    // =====================================
    // BRIDGE READY
    // =====================================

    if (
      data.type ===
      "BOMIS_BRIDGE_READY"
    ) {

      console.log(
        "BOMIS Bridge is ready."
      );

      return;
    }


    // =====================================
    // PROCESSING
    // =====================================

    if (
      data.type ===
      "BOMIS_PROCESSING"
    ) {

      console.log(
        "Bridge is processing audio."
      );


      status.textContent =
        "⏳ Transcribing conversation...";


      conversationBox.textContent =
        "⏳ Transcribing conversation...\n\nPlease wait...";


      return;
    }


    // =====================================
    // FINAL RESULT
    // =====================================

    if (
      data.type ===
      "BOMIS_RESULT"
    ) {

      console.log(
        "FINAL RESULT RECEIVED:"
      );

      console.log(
        data.result
      );


      const result =
        data.result;


      if (
        result &&
        result.success
      ) {

        // =================================
        // SHOW TRANSCRIPT
        // =================================

        const transcript =
          result.transcript ||
          "";


        if (transcript.trim()) {

          conversationBox.textContent =
            transcript;


          status.textContent =
            "✅ Conversation transcribed successfully.";

        } else {

          conversationBox.textContent =
            "No speech was detected.";


          status.textContent =
            "⚠️ No speech detected.";

        }


        // =================================
        // RESET BUTTONS
        // =================================

        startBtn.disabled =
          false;


        stopBtn.disabled =
          true;


      } else {

        // =================================
        // SHOW ERROR
        // =================================

        const errorMessage =
          result &&
          result.error
            ? result.error
            : "Unknown transcription error.";


        console.error(
          "Transcription error:",
          errorMessage
        );


        conversationBox.textContent =
          "❌ Error:\n\n" +
          errorMessage;


        status.textContent =
          "❌ Transcription failed.";


        startBtn.disabled =
          false;


        stopBtn.disabled =
          true;

      }

    }

  }
);


// ==========================================
// SAFETY TIMEOUT
// ==========================================
//
// If something goes wrong and no response
// arrives, don't leave the user waiting
// forever.
// ==========================================

setInterval(
  function() {

    if (
      recordingStartTime &&
      Date.now() -
        recordingStartTime >
        5 * 60 * 1000
    ) {

      recordingStartTime =
        null;

    }

  },
  30000
);


console.log(
  "===== BOMIS GITHUB APP LOADED ====="
);

</script>

</body>
</html>
