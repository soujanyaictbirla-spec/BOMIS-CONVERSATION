<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>BOMIS Conversation</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 15px;
      background: #f5f7fa;
      font-family: Arial, Helvetica, sans-serif;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 850px;
      margin: auto;
      background: white;
      border-radius: 14px;
      padding: 30px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin: 0 0 8px;
      font-size: 30px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #4285f4;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 25px 0 15px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 13px 25px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #startBtn {
      background: #1b9e5a;
      color: white;
    }

    #startBtn:hover {
      background: #16884d;
    }

    #stopBtn {
      background: #d93025;
      color: white;
    }

    #stopBtn:hover {
      background: #b9251c;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .timer {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      margin: 15px 0;
    }

    .status {
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      background: #f1f3f4;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .conversation-title {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    #conversationBox {
      min-height: 220px;
      max-height: 450px;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 18px;
      background: #fafafa;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    .download-area {
      text-align: center;
      margin-top: 20px;
    }

    #downloadLink {
      display: none;
      text-decoration: none;
      background: #4285f4;
      color: white;
      padding: 11px 20px;
      border-radius: 8px;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      .buttons {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>BOMIS Conversation</h1>

  <div class="subtitle">
    Student Conversation Recorder
  </div>

  <div class="form-row">

    <div>
      <label for="studentName">
        Student Name
      </label>

      <input
        type="text"
        id="studentName"
        placeholder="Enter student name"
      >
    </div>

    <div>
      <label for="grade">
        Grade
      </label>

      <select id="grade">

        <option value="">
          Select Grade
        </option>

        <option>Grade 1</option>
        <option>Grade 2</option>
        <option>Grade 3</option>
        <option>Grade 4</option>
        <option>Grade 5</option>
        <option>Grade 6</option>
        <option>Grade 7</option>
        <option>Grade 8</option>
        <option>Grade 9</option>
        <option>Grade 10</option>
        <option>Grade 11</option>
        <option>Grade 12</option>

      </select>
    </div>

  </div>

  <div class="buttons">

    <button
      id="startBtn"
      onclick="startRecording()"
    >
      🎙️ Start Recording
    </button>

    <button
      id="stopBtn"
      onclick="stopRecording()"
      disabled
    >
      ⏹ Stop
    </button>

  </div>

  <div
    class="timer"
    id="timer"
  >
    00:00
  </div>

  <div
    class="status"
    id="status"
  >
    Ready to record
  </div>

  <div class="conversation-title">
    Conversation
  </div>

  <div id="conversationBox">
    Your conversation will appear here after processing.
  </div>

  <div class="download-area">

    <a
      id="downloadLink"
      download="BOMIS_Conversation.txt"
    >
      ⬇ Download Conversation
    </a>

  </div>

</div>


<script>

/* =========================================================
   SUPABASE EDGE FUNCTION
   ========================================================= */

const SUPABASE_FUNCTION_URL =
  "https://pvlmonbewsbqnfvxcxop.supabase.co/functions/v1/process-conversation";


/* =========================================================
   VARIABLES
   ========================================================= */

let mediaRecorder = null;

let audioChunks = [];

let recordingStartTime = null;

let timerInterval = null;

let audioBlob = null;


/* =========================================================
   ELEMENTS
   ========================================================= */

const startBtn =
  document.getElementById("startBtn");

const stopBtn =
  document.getElementById("stopBtn");

const timer =
  document.getElementById("timer");

const status =
  document.getElementById("status");

const conversationBox =
  document.getElementById("conversationBox");

const downloadLink =
  document.getElementById("downloadLink");


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(message) {

  status.textContent = message;

  console.log("STATUS:", message);

}


/* =========================================================
   START RECORDING
   ========================================================= */

async function startRecording() {

  try {

    const studentName =
      document
        .getElementById("studentName")
        .value
        .trim();

    const grade =
      document
        .getElementById("grade")
        .value;

    if (!studentName) {

      alert("Please enter Student Name.");

      return;
    }

    if (!grade) {

      alert("Please select Grade.");

      return;
    }


    conversationBox.textContent =
      "Recording conversation...";

    downloadLink.style.display =
      "none";


    setStatus(
      "Requesting microphone..."
    );


    const stream =
      await navigator.mediaDevices
        .getUserMedia({
          audio: true
        });


    audioChunks = [];


    let options = {};

    if (
      MediaRecorder.isTypeSupported(
        "audio/webm;codecs=opus"
      )
    ) {

      options.mimeType =
        "audio/webm;codecs=opus";

    } else if (
      MediaRecorder.isTypeSupported(
        "audio/webm"
      )
    ) {

      options.mimeType =
        "audio/webm";
    }


    mediaRecorder =
      new MediaRecorder(
        stream,
        options
      );


    mediaRecorder.ondataavailable =
      function(event) {

        if (event.data.size > 0) {

          audioChunks.push(
            event.data
          );

        }

      };


    mediaRecorder.onstop =
      function() {

        audioBlob =
          new Blob(
            audioChunks,
            {
              type:
                mediaRecorder.mimeType ||
                "audio/webm"
            }
          );


        console.log(
          "Audio size:",
          audioBlob.size
        );


        // Stop microphone
        stream
          .getTracks()
          .forEach(
            track =>
              track.stop()
          );


        uploadAudio();
      };


    mediaRecorder.start();


    recordingStartTime =
      Date.now();


    timerInterval =
      setInterval(
        updateTimer,
        1000
      );


    startBtn.disabled =
      true;

    stopBtn.disabled =
      false;


    setStatus(
      "🔴 Recording..."
    );


    console.log(
      "Recording started."
    );

  } catch (error) {

    console.error(
      error
    );

    setStatus(
      "Microphone error: " +
      error.message
    );

    alert(
      "Unable to access microphone.\n\n" +
      error.message
    );

  }

}


/* =========================================================
   STOP RECORDING
   ========================================================= */

function stopRecording() {

  if (
    !mediaRecorder ||
    mediaRecorder.state === "inactive"
  ) {

    return;
  }


  console.log(
    "Stopping recording..."
  );


  mediaRecorder.stop();


  clearInterval(
    timerInterval
  );


  startBtn.disabled =
    false;

  stopBtn.disabled =
    true;


  setStatus(
    "Preparing recording..."
  );

}


/* =========================================================
   TIMER
   ========================================================= */

function updateTimer() {

  if (!recordingStartTime) {

    return;
  }


  const elapsed =
    Math.floor(
      (
        Date.now() -
        recordingStartTime
      ) / 1000
    );


  const minutes =
    Math.floor(
      elapsed / 60
    );


  const seconds =
    elapsed % 60;


  timer.textContent =
    String(minutes)
      .padStart(2, "0") +
    ":" +
    String(seconds)
      .padStart(2, "0");

}


/* =========================================================
   UPLOAD AUDIO
   ========================================================= */

async function uploadAudio() {

  try {

    if (!audioBlob) {

      throw new Error(
        "Audio recording is empty."
      );
    }


    setStatus(
      "Processing conversation..."
    );


    conversationBox.textContent =
      "Sending audio to Deepgram...";


    const studentName =
      document
        .getElementById("studentName")
        .value
        .trim();


    const grade =
      document
        .getElementById("grade")
        .value;


    const today =
      new Date();


    const year =
      today.getFullYear();


    const month =
      String(
        today.getMonth() + 1
      ).padStart(
        2,
        "0"
      );


    const day =
      String(
        today.getDate()
      ).padStart(
        2,
        "0"
      );


    const date =
      `${year}-${month}-${day}`;


    /* -----------------------------------------
       FORM DATA
       ----------------------------------------- */

    const formData =
      new FormData();


    formData.append(
      "studentName",
      studentName
    );


    formData.append(
      "grade",
      grade
    );


    formData.append(
      "date",
      date
    );


    formData.append(
      "audio",
      audioBlob,
      "bomis-conversation.webm"
    );


    console.log(
      "Sending audio to Supabase..."
    );


    /* -----------------------------------------
       SEND TO SUPABASE
       ----------------------------------------- */

    const response =
      await fetch(
        SUPABASE_FUNCTION_URL,
        {
          method: "POST",
          body: formData
        }
      );


    const responseText =
      await response.text();


    console.log(
      "Supabase response:",
      responseText
    );


    let result;


    try {

      result =
        JSON.parse(
          responseText
        );

    } catch (error) {

      throw new Error(
        "Invalid response from Supabase:\n" +
        responseText
      );

    }


    if (!response.ok) {

      throw new Error(
        result.error ||
        "Supabase processing failed."
      );

    }


    if (!result.success) {

      throw new Error(
        result.error ||
        "Conversation processing failed."
      );

    }


    /* -----------------------------------------
       SHOW TRANSCRIPT
       ----------------------------------------- */

    showTranscript(
      result.conversation
    );


    setStatus(
      "✅ Conversation saved successfully!"
    );


  } catch (error) {

    console.error(
      "Processing error:",
      error
    );


    setStatus(
      "❌ Error processing conversation"
    );


    conversationBox.textContent =
      "Error:\n\n" +
      error.message;


    alert(
      "Conversation could not be processed.\n\n" +
      error.message
    );

  }

}


/* =========================================================
   SHOW TRANSCRIPT
   ========================================================= */

function showTranscript(
  transcript
) {

  conversationBox.textContent =
    transcript;


  /* -----------------------------------------
     DOWNLOAD TXT FILE
     ----------------------------------------- */

  const studentName =
    document
      .getElementById("studentName")
      .value
      .trim();


  const grade =
    document
      .getElementById("grade")
      .value;


  const textFile =
    new Blob(
      [
        "BOMIS CONVERSATION\n\n" +
        "Student Name: " +
        studentName +
        "\n" +
        "Grade: " +
        grade +
        "\n\n" +
        transcript
      ],
      {
        type:
          "text/plain;charset=utf-8"
      }
    );


  const url =
    URL.createObjectURL(
      textFile
    );


  downloadLink.href =
    url;


  downloadLink.download =
    "BOMIS_" +
    studentName.replace(
      /\s+/g,
      "_"
    ) +
    "_Conversation.txt";


  downloadLink.style.display =
    "inline-block";

}


/* =========================================================
   INITIAL MESSAGE
   ========================================================= */

console.log(
  "===== BOMIS GITHUB APP LOADED ====="
);

console.log(
  "Supabase Function:",
  SUPABASE_FUNCTION_URL
);

</script>

</body>
</html>
