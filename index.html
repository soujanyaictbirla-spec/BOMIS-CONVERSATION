<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>BOMIS CONVERSATION</title>

<style>

body {
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 700px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.12);
}

h1 {
  text-align: center;
  color: #1d3557;
}

.subtitle {
  text-align: center;
  color: #666;
  margin-bottom: 25px;
}

label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
}

input,
select {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  box-sizing: border-box;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  border: none;
  border-radius: 8px;
  font-size: 17px;
  cursor: pointer;
}

#startBtn {
  background: #2a9d8f;
  color: white;
}

#stopBtn {
  background: #e76f51;
  color: white;
}

#downloadBtn {
  background: #457b9d;
  color: white;
}

button:disabled {
  background: #aaa !important;
  cursor: not-allowed;
}

.status {
  margin-top: 20px;
  padding: 12px;
  border-radius: 8px;
  background: #eef3f8;
  text-align: center;
}

.timer {
  text-align: center;
  font-size: 30px;
  margin-top: 15px;
  font-weight: bold;
}

.result {
  margin-top: 20px;
  padding: 15px;
  background: #f7f7f7;
  border-radius: 10px;
  white-space: pre-wrap;
  line-height: 1.6;
  min-height: 80px;
}

#bridgeFrame {
  display: none;
}

</style>

</head>

<body>

<div class="container">

<h1>🎤 BOMIS CONVERSATION</h1>

<div class="subtitle">
Student Conversation Recorder
</div>


<label>Student Name</label>

<input
  type="text"
  id="studentName"
  placeholder="Enter student name"
>


<label>Grade</label>

<select id="grade">

<option value="">Select Grade</option>

<option>Grade 1</option>
<option>Grade 2</option>
<option>Grade 3</option>
<option>Grade 4</option>
<option>Grade 5</option>
<option>Grade 6</option>
<option>Grade 7</option>
<option>Grade 8</option>
<option>Grade 9</option>
<option>Grade 10</option>
<option>Grade 11</option>
<option>Grade 12</option>

</select>


<label>Date</label>

<input
  type="date"
  id="date"
>


<div class="timer" id="timer">
00:00
</div>


<button
  id="startBtn"
  onclick="startRecording()"
>
Start Conversation
</button>


<button
  id="stopBtn"
  onclick="stopRecording()"
  disabled
>
Stop Conversation
</button>


<button
  id="downloadBtn"
  onclick="downloadAudio()"
  disabled
>
Download Audio
</button>


<div
  class="status"
  id="status"
>
Ready to record
</div>


<div
  class="result"
  id="result"
>
Conversation will appear here.
</div>

</div>


<!-- APPS SCRIPT BRIDGE -->

<iframe
  id="bridgeFrame"
  src="https://script.google.com/macros/s/AKfycby4QSe_GgfQINvLb_T5Z6BtzoMNa6Qc14vlKSU6XTrfvM2iH1vBE-ugxnW1DAJzgnZ2eg/exec"
  allow="microphone"
></iframe>


<script>

let mediaRecorder = null;

let audioChunks = [];

let audioBlob = null;

let timerInterval = null;

let seconds = 0;


const bridgeFrame =
  document.getElementById("bridgeFrame");

const startBtn =
  document.getElementById("startBtn");

const stopBtn =
  document.getElementById("stopBtn");

const downloadBtn =
  document.getElementById("downloadBtn");

const status =
  document.getElementById("status");

const resultBox =
  document.getElementById("result");

const timer =
  document.getElementById("timer");

const dateInput =
  document.getElementById("date");


/* TODAY'S DATE */

const today = new Date();

const yyyy = today.getFullYear();

const mm =
  String(today.getMonth() + 1)
  .padStart(2, "0");

const dd =
  String(today.getDate())
  .padStart(2, "0");

dateInput.value =
  yyyy + "-" + mm + "-" + dd;


/* RECEIVE MESSAGE FROM APPS SCRIPT */

window.addEventListener(
  "message",
  function(event) {

    const data = event.data;

    if (!data || !data.type) {
      return;
    }


    /* BRIDGE READY */

    if (
      data.type ===
      "BOMIS_BRIDGE_READY"
    ) {

      status.innerText =
        "Ready to record";

      return;
    }


    /* PROCESSING */

    if (
      data.type ===
      "BOMIS_PROCESSING"
    ) {

      status.innerText =
        "⏳ Deepgram is processing...";

      return;
    }


    /* FINAL RESULT */

    if (
      data.type ===
      "BOMIS_RESULT"
    ) {

      const response =
        data.result;


      if (
        response &&
        response.success
      ) {

        status.innerText =
          "✅ Conversation saved successfully";


        resultBox.innerText =
          response.transcript ||
          "No conversation detected.";

      }

      else {

        status.innerText =
          "❌ Error processing conversation";


        resultBox.innerText =
          response &&
          response.error
            ? response.error
            : "Unknown error.";

      }

    }

  }
);


/* START */

async function startRecording() {


  const studentName =
    document
      .getElementById("studentName")
      .value
      .trim();


  const grade =
    document
      .getElementById("grade")
      .value;


  if (!studentName) {

    alert(
      "Please enter the student name."
    );

    return;
  }


  if (!grade) {

    alert(
      "Please select the grade."
    );

    return;
  }


  try {


    const stream =
      await navigator
        .mediaDevices
        .getUserMedia({
          audio: true
        });


    audioChunks = [];

    audioBlob = null;

    seconds = 0;

    timer.innerText =
      "00:00";


    let options = {};


    if (
      MediaRecorder.isTypeSupported(
        "audio/webm;codecs=opus"
      )
    ) {

      options.mimeType =
        "audio/webm;codecs=opus";

    }


    mediaRecorder =
      new MediaRecorder(
        stream,
        options
      );


    mediaRecorder.ondataavailable =
      function(event) {

        if (
          event.data &&
          event.data.size > 0
        ) {

          audioChunks.push(
            event.data
          );

        }

      };


    mediaRecorder.onstop =
      function() {


        audioBlob =
          new Blob(
            audioChunks,
            {
              type:
                mediaRecorder.mimeType ||
                "audio/webm"
            }
          );


        downloadBtn.disabled =
          false;


        sendAudioToServer();

      };


    mediaRecorder.start();


    timerInterval =
      setInterval(
        updateTimer,
        1000
      );


    startBtn.disabled =
      true;

    stopBtn.disabled =
      false;

    downloadBtn.disabled =
      true;


    status.innerText =
      "🔴 Recording conversation...";


    resultBox.innerText = "";

  }

  catch(error) {

    console.error(error);

    alert(
      "Please allow microphone access in Chrome."
    );

    status.innerText =
      "Microphone permission failed.";

  }

}


/* STOP */

function stopRecording() {


  if (!mediaRecorder) {
    return;
  }


  if (
    mediaRecorder.state ===
    "recording"
  ) {

    mediaRecorder.stop();

  }


  if (mediaRecorder.stream) {

    mediaRecorder.stream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );

  }


  clearInterval(
    timerInterval
  );


  stopBtn.disabled =
    true;

  startBtn.disabled =
    false;


  status.innerText =
    "⏳ Preparing conversation...";

}


/* TIMER */

function updateTimer() {

  seconds++;


  const minutes =
    Math.floor(seconds / 60)
      .toString()
      .padStart(2, "0");


  const secs =
    (seconds % 60)
      .toString()
      .padStart(2, "0");


  timer.innerText =
    minutes + ":" + secs;

}


/* BLOB TO BASE64 */

function blobToBase64(blob) {

  return new Promise(
    function(resolve, reject) {

      const reader =
        new FileReader();


      reader.onloadend =
        function() {

          try {

            const result =
              reader.result;

            const base64 =
              result.split(",")[1];

            resolve(base64);

          }

          catch(error) {

            reject(error);

          }

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(blob);

    }
  );

}


/* SEND AUDIO */

async function sendAudioToServer() {


  if (!audioBlob) {

    status.innerText =
      "No audio recorded.";

    return;
  }


  try {


    status.innerText =
      "⏳ Preparing audio...";


    const base64 =
      await blobToBase64(
        audioBlob
      );


    const studentName =
      document
        .getElementById("studentName")
        .value
        .trim();


    const grade =
      document
        .getElementById("grade")
        .value;


    const date =
      document
        .getElementById("date")
        .value;


    status.innerText =
      "⏳ Sending to Deepgram...";


    bridgeFrame
      .contentWindow
      .postMessage(

        {
          type:
            "PROCESS_AUDIO",

          base64:
            base64,

          mimeType:
            audioBlob.type ||
            "audio/webm",

          studentName:
            studentName,

          grade:
            grade,

          date:
            date

        },

        "*"

      );

  }

  catch(error) {

    console.error(error);

    status.innerText =
      "❌ Error sending audio.";

    resultBox.innerText =
      error.message ||
      String(error);

  }

}


/* DOWNLOAD */

function downloadAudio() {


  if (!audioBlob) {

    alert(
      "No recording available."
    );

    return;
  }


  const studentName =
    document
      .getElementById("studentName")
      .value
      .trim();


  const grade =
    document
      .getElementById("grade")
      .value
      .replace(
        /\s+/g,
        "_"
      );


  const safeName =
    studentName
      .replace(
        /[^a-z0-9]/gi,
        "_"
      );


  const filename =
    safeName +
    "_" +
    grade +
    "_Conversation.webm";


  const url =
    URL.createObjectURL(
      audioBlob
    );


  const link =
    document.createElement("a");


  link.href = url;

  link.download = filename;

  document.body.appendChild(link);

  link.click();

  document.body.removeChild(link);


  setTimeout(
    function() {

      URL.revokeObjectURL(url);

    },
    1000
  );

}

</script>

</body>
</html>
