<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>BOMIS Conversation</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }


    .container {
      width: 92%;
      max-width: 900px;
      margin: 30px auto;
    }


    .header {
      background: white;
      border-radius: 16px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }


    .header h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }


    .header p {
      margin: 0;
      color: #666;
    }


    .card {
      background: white;
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }


    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-weight: bold;
    }


    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }


    .buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 22px;
    }


    button {
      border: none;
      border-radius: 9px;
      padding: 13px 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }


    #startBtn {
      background: #16803c;
      color: white;
    }


    #stopBtn {
      background: #c62828;
      color: white;
    }


    #downloadBtn {
      background: #1565c0;
      color: white;
    }


    #clearBtn {
      background: #666;
      color: white;
    }


    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }


    .status {
      margin-top: 18px;
      padding: 14px;
      border-radius: 8px;
      background: #eef3f8;
      font-weight: bold;
    }


    .timer {
      text-align: center;
      font-size: 34px;
      font-weight: bold;
      margin: 20px 0;
    }


    .recording {
      animation: pulse 1.3s infinite;
    }


    @keyframes pulse {

      0% {
        opacity: 1;
      }

      50% {
        opacity: 0.5;
      }

      100% {
        opacity: 1;
      }

    }


    .conversation-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }


    #conversationBox {
      min-height: 200px;
      background: #f8f9fa;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 18px;
      white-space: pre-wrap;
      line-height: 1.6;
      overflow-y: auto;
    }


    .small {
      font-size: 13px;
      color: #777;
      margin-top: 8px;
    }


    /*
      Hidden Apps Script Bridge
    */

    #bridgeFrame {

      width: 1px;
      height: 1px;

      position: fixed;

      left: -100px;
      top: -100px;

      border: 0;

      opacity: 0;

      pointer-events: none;

    }

  </style>

</head>


<body>


<div class="container">


  <!-- =====================================================
       HEADER
       ===================================================== -->

  <div class="header">

    <h1>
      BOMIS Conversation
    </h1>

    <p>
      Student Conversation Recorder & Transcriber
    </p>

  </div>



  <!-- =====================================================
       STUDENT DETAILS
       ===================================================== -->

  <div class="card">


    <label for="studentName">
      Student Name
    </label>

    <input
      type="text"
      id="studentName"
      placeholder="Enter student name"
    >



    <label for="grade">
      Grade
    </label>

    <input
      type="text"
      id="grade"
      placeholder="Example: Grade 5"
    >



    <label for="date">
      Date
    </label>

    <input
      type="date"
      id="date"
    >



    <!-- =================================================
         BUTTONS
         ================================================= -->

    <div class="buttons">


      <button
        id="startBtn"
      >
        🎙️ Start Recording
      </button>


      <button
        id="stopBtn"
        disabled
      >
        ⏹ Stop Recording
      </button>


      <button
        id="downloadBtn"
        disabled
      >
        ⬇ Download Audio
      </button>


      <button
        id="clearBtn"
      >
        Clear
      </button>


    </div>



    <!-- =================================================
         TIMER
         ================================================= -->

    <div
      id="timer"
      class="timer"
    >
      00:00
    </div>



    <!-- =================================================
         STATUS
         ================================================= -->

    <div
      id="status"
      class="status"
    >
      🟢 Ready to record
    </div>


    <div class="small">
      Please allow microphone access when Chrome asks.
    </div>


  </div>



  <!-- =====================================================
       CONVERSATION
       ===================================================== -->

  <div class="card">


    <div class="conversation-title">
      📝 Conversation
    </div>


    <div id="conversationBox">

      Conversation will appear here after recording.

    </div>


  </div>


</div>



<!-- =======================================================
     APPS SCRIPT BRIDGE
     ======================================================= -->

<iframe
  id="bridgeFrame"
  src="https://script.google.com/macros/s/AKfycbxxsgLpoLYEjGcL8McSgC4i--PzandTUhPKnUl_Dt3dK77ZOleP8kWui2qLn6EKcG6q/exec"
  allow="microphone"
></iframe>



<script>


// ==========================================================
// ELEMENTS
// ==========================================================

const startBtn =
  document.getElementById(
    "startBtn"
  );


const stopBtn =
  document.getElementById(
    "stopBtn"
  );


const downloadBtn =
  document.getElementById(
    "downloadBtn"
  );


const clearBtn =
  document.getElementById(
    "clearBtn"
  );


const statusBox =
  document.getElementById(
    "status"
  );


const conversationBox =
  document.getElementById(
    "conversationBox"
  );


const timerBox =
  document.getElementById(
    "timer"
  );


const studentNameInput =
  document.getElementById(
    "studentName"
  );


const gradeInput =
  document.getElementById(
    "grade"
  );


const dateInput =
  document.getElementById(
    "date"
  );


const bridgeFrame =
  document.getElementById(
    "bridgeFrame"
  );



// ==========================================================
// VARIABLES
// ==========================================================

let mediaRecorder = null;

let audioChunks = [];

let audioBlob = null;

let audioDataUrl = null;

let recordingSeconds = 0;

let timerInterval = null;

let bridgeReady = false;



// ==========================================================
// TODAY'S DATE
// ==========================================================

const today =
  new Date();


const yyyy =
  today.getFullYear();


const mm =
  String(
    today.getMonth() + 1
  ).padStart(
    2,
    "0"
  );


const dd =
  String(
    today.getDate()
  ).padStart(
    2,
    "0"
  );


dateInput.value =
  yyyy +
  "-" +
  mm +
  "-" +
  dd;



// ==========================================================
// STATUS
// ==========================================================

function setStatus(
  message
) {

  statusBox.textContent =
    message;

}



// ==========================================================
// TIMER
// ==========================================================

function startTimer() {

  clearInterval(
    timerInterval
  );


  recordingSeconds =
    0;


  timerBox.textContent =
    "00:00";


  timerInterval =
    setInterval(
      function() {

        recordingSeconds++;


        const minutes =
          Math.floor(
            recordingSeconds / 60
          );


        const seconds =
          recordingSeconds % 60;


        timerBox.textContent =
          String(
            minutes
          ).padStart(
            2,
            "0"
          ) +
          ":" +
          String(
            seconds
          ).padStart(
            2,
            "0"
          );

      },
      1000
    );

}



function stopTimer() {

  clearInterval(
    timerInterval
  );

}



// ==========================================================
// BRIDGE MESSAGE LISTENER
// ==========================================================

window.addEventListener(
  "message",
  function(event) {


    const data =
      event.data;


    if (!data) {
      return;
    }


    console.log(
      "GitHub received message:",
      data.type
    );



    // ======================================================
    // BRIDGE READY
    // ======================================================

    if (
      data.type ===
      "BOMIS_BRIDGE_READY"
    ) {


      bridgeReady =
        true;


      console.log(
        "BOMIS Bridge is ready."
      );


      return;

    }



    // ======================================================
    // PROCESSING
    // ======================================================

    if (
      data.type ===
      "BOMIS_PROCESSING"
    ) {


      setStatus(
        "🤖 Processing conversation... Please wait."
      );


      return;

    }



    // ======================================================
    // FINAL RESULT
    // ======================================================

    if (
      data.type ===
      "BOMIS_RESULT"
    ) {


      const result =
        data.result;


      console.log(
        "Final result:",
        result
      );


      if (
        result &&
        result.success
      ) {


        conversationBox.textContent =
          result.transcript ||
          "No conversation detected.";


        setStatus(
          "✅ Conversation saved successfully to Google Sheet."
        );


      } else {


        const errorMessage =
          result &&
          result.error
            ? result.error
            : "Unknown error occurred.";


        setStatus(
          "❌ Error: " +
          errorMessage
        );

      }


      startBtn.disabled =
        false;


      stopBtn.disabled =
        true;


      return;

    }

  }
);



// ==========================================================
// BRIDGE LOAD
// ==========================================================

bridgeFrame.addEventListener(
  "load",
  function() {

    console.log(
      "BOMIS Bridge iframe loaded."
    );


    /*
      Send a ping after the iframe loads.
    */

    setTimeout(
      function() {

        if (
          bridgeFrame.contentWindow
        ) {

          bridgeFrame.contentWindow.postMessage(
            {
              type:
                "BOMIS_PING"
            },
            "*"
          );

        }

      },
      1000
    );

  }
);



// ==========================================================
// START RECORDING
// ==========================================================

startBtn.addEventListener(
  "click",
  async function() {


    try {


      // ----------------------------------------------------
      // STUDENT NAME
      // ----------------------------------------------------

      const studentName =
        studentNameInput.value.trim();


      if (!studentName) {

        alert(
          "Please enter the student name."
        );


        studentNameInput.focus();


        return;

      }



      // ----------------------------------------------------
      // GRADE
      // ----------------------------------------------------

      const grade =
        gradeInput.value.trim();


      if (!grade) {

        alert(
          "Please enter the grade."
        );


        gradeInput.focus();


        return;

      }



      // ----------------------------------------------------
      // CHECK BROWSER SUPPORT
      // ----------------------------------------------------

      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ) {

        throw new Error(
          "Microphone access is not supported by this browser."
        );

      }



      // ----------------------------------------------------
      // REQUEST MICROPHONE
      // ----------------------------------------------------

      setStatus(
        "🎙️ Requesting microphone access..."
      );


      const stream =
        await navigator.mediaDevices.getUserMedia(
          {
            audio: true
          }
        );



      console.log(
        "Microphone access granted."
      );



      // ----------------------------------------------------
      // RESET AUDIO
      // ----------------------------------------------------

      audioChunks =
        [];


      audioBlob =
        null;


      audioDataUrl =
        null;



      // ----------------------------------------------------
      // MEDIA RECORDER
      // ----------------------------------------------------

      let recorderOptions =
        {};


      if (
        MediaRecorder.isTypeSupported(
          "audio/webm;codecs=opus"
        )
      ) {

        recorderOptions = {

          mimeType:
            "audio/webm;codecs=opus"

        };

      } else if (
        MediaRecorder.isTypeSupported(
          "audio/webm"
        )
      ) {

        recorderOptions = {

          mimeType:
            "audio/webm"

        };

      }



      mediaRecorder =
        new MediaRecorder(
          stream,
          recorderOptions
        );



      // ----------------------------------------------------
      // AUDIO DATA
      // ----------------------------------------------------

      mediaRecorder.ondataavailable =
        function(event) {


          if (
            event.data &&
            event.data.size > 0
          ) {

            audioChunks.push(
              event.data
            );

          }

        };



      // ----------------------------------------------------
      // RECORDING STOPPED
      // ----------------------------------------------------

      mediaRecorder.onstop =
        async function() {


          console.log(
            "MediaRecorder stopped."
          );


          stream
            .getTracks()
            .forEach(
              function(track) {

                track.stop();

              }
            );



          // ------------------------------------------------
          // CREATE AUDIO BLOB
          // ------------------------------------------------

          audioBlob =
            new Blob(
              audioChunks,
              {
                type:
                  mediaRecorder.mimeType ||
                  "audio/webm"
              }
            );


          console.log(
            "Audio Blob size:",
            audioBlob.size
          );


          if (
            audioBlob.size === 0
          ) {

            setStatus(
              "❌ No audio was recorded."
            );


            startBtn.disabled =
              false;


            return;

          }



          // ------------------------------------------------
          // CONVERT TO DATA URL
          // ------------------------------------------------

          setStatus(
            "⏳ Preparing audio..."
          );


          try {

            audioDataUrl =
              await blobToDataURL(
                audioBlob
              );

          } catch (error) {

            console.error(
              error
            );


            setStatus(
              "❌ Could not prepare audio."
            );


            startBtn.disabled =
              false;


            return;

          }



          console.log(
            "Audio Data URL length:",
            audioDataUrl.length
          );



          // ------------------------------------------------
          // DOWNLOAD AUDIO
          // ------------------------------------------------

          downloadBtn.disabled =
            false;


          downloadAudio();



          // ------------------------------------------------
          // SEND TO APPS SCRIPT
          // ------------------------------------------------

          sendAudioToBridge();

        };



      // ----------------------------------------------------
      // START
      // ----------------------------------------------------

      mediaRecorder.start(
        250
      );


      startBtn.disabled =
        true;


      stopBtn.disabled =
        false;


      downloadBtn.disabled =
        true;


      conversationBox.textContent =
        "Recording conversation...";


      timerBox.classList.add(
        "recording"
      );


      startTimer();


      setStatus(
        "🔴 Recording conversation..."
      );


      console.log(
        "Recording started."
      );


    } catch (error) {


      console.error(
        "Microphone error:",
        error
      );


      setStatus(
        "❌ Microphone error: " +
        error.message
      );


      startBtn.disabled =
        false;


      stopBtn.disabled =
        true;

    }

  }
);



// ==========================================================
// STOP RECORDING
// ==========================================================

stopBtn.addEventListener(
  "click",
  function() {


    if (
      mediaRecorder &&
      mediaRecorder.state !==
      "inactive"
    ) {


      setStatus(
        "⏳ Stopping recording..."
      );


      mediaRecorder.stop();


      stopTimer();


      timerBox.classList.remove(
        "recording"
      );


      stopBtn.disabled =
        true;


      startBtn.disabled =
        true;

    }

  }
);



// ==========================================================
// BLOB TO DATA URL
// ==========================================================

function blobToDataURL(
  blob
) {


  return new Promise(
    function(resolve, reject) {


      const reader =
        new FileReader();


      reader.onload =
        function() {

          resolve(
            reader.result
          );

        };


      reader.onerror =
        function(error) {

          reject(
            error
          );

        };


      reader.readAsDataURL(
        blob
      );

    }
  );

}



// ==========================================================
// SEND AUDIO TO BRIDGE
// ==========================================================

function sendAudioToBridge() {


  if (!audioDataUrl) {

    setStatus(
      "❌ Audio data is missing."
    );


    startBtn.disabled =
      false;


    return;

  }



  if (
    !bridgeFrame.contentWindow
  ) {

    setStatus(
      "❌ BOMIS Bridge is not available."
    );


    startBtn.disabled =
      false;


    return;

  }



  const studentName =
    studentNameInput.value.trim();


  const grade =
    gradeInput.value.trim();


  const date =
    dateInput.value;



  console.log(
    "Sending audio to BOMIS Bridge..."
  );


  console.log(
    "Audio Data URL length:",
    audioDataUrl.length
  );


  setStatus(
    "⏳ Sending conversation for transcription..."
  );



  bridgeFrame.contentWindow.postMessage(

    {

      type:
        "PROCESS_AUDIO",

      audioDataUrl:
        audioDataUrl,

      mimeType:
        audioBlob.type ||
        "audio/webm",

      studentName:
        studentName,

      grade:
        grade,

      date:
        date

    },

    "*"

  );

}



// ==========================================================
// DOWNLOAD AUDIO
// ==========================================================

function downloadAudio() {


  if (!audioBlob) {
    return;
  }



  const studentName =
    studentNameInput.value
      .trim()
      .replace(
        /[^a-zA-Z0-9-_ ]/g,
        ""
      )
      .replace(
        /\s+/g,
        "_"
      ) ||
    "Student";


  const grade =
    gradeInput.value
      .trim()
      .replace(
        /[^a-zA-Z0-9-_ ]/g,
        ""
      )
      .replace(
        /\s+/g,
        "_"
      ) ||
    "Grade";


  const fileName =
    "BOMIS_" +
    studentName +
    "_" +
    grade +
    "_Conversation.webm";



  const url =
    URL.createObjectURL(
      audioBlob
    );


  const link =
    document.createElement(
      "a"
    );


  link.href =
    url;


  link.download =
    fileName;



  document.body.appendChild(
    link
  );


  link.click();


  document.body.removeChild(
    link
  );



  setTimeout(
    function() {

      URL.revokeObjectURL(
        url
      );

    },
    1000
  );

}



// ==========================================================
// DOWNLOAD BUTTON
// ==========================================================

downloadBtn.addEventListener(
  "click",
  function() {

    downloadAudio();

  }
);



// ==========================================================
// CLEAR BUTTON
// ==========================================================

clearBtn.addEventListener(
  "click",
  function() {


    if (
      mediaRecorder &&
      mediaRecorder.state !==
      "inactive"
    ) {

      mediaRecorder.stop();

    }


    studentNameInput.value =
      "";


    gradeInput.value =
      "";


    dateInput.value =
      yyyy +
      "-" +
      mm +
      "-" +
      dd;


    conversationBox.textContent =
      "Conversation will appear here after recording.";


    audioBlob =
      null;


    audioDataUrl =
      null;


    downloadBtn.disabled =
      true;


    stopBtn.disabled =
      true;


    startBtn.disabled =
      false;


    stopTimer();


    recordingSeconds =
      0;


    timerBox.textContent =
      "00:00";


    timerBox.classList.remove(
      "recording"
    );


    setStatus(
      "🟢 Ready to record"
    );

  }


);


</script>

</body>

</html>
