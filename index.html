<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BOMIS Conversation</title>

  <style>
    body {
      font-family: Arial, sans-serif;

      padding: 20px;
    }

    .container {
      max-width: 850px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    #startBtn {
      background: #198754;
      color: white;
    }

    #stopBtn {
      background: #dc3545;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      margin-top: 20px;
      padding: 14px;
      background: #f1f3f5;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
    }

    .conversation-title {
      margin-top: 25px;
      font-size: 18px;
      font-weight: bold;
    }

    #conversationBox {
      margin-top: 10px;
      min-height: 180px;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: #fafafa;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    #bridgeFrame {
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>BOMIS Conversation</h1>

  <label>Student Name</label>
  <input
    type="text"
    id="studentName"
    placeholder="Enter student name"
  >

  <label>Grade</label>
  <input
    type="text"
    id="grade"
    placeholder="Enter grade"
  >

  <label>Date</label>
  <input
    type="date"
    id="date"
  >

  <div class="buttons">
    <button id="startBtn">
      🎙️ Start Recording
    </button>

    <button id="stopBtn" disabled>
      ⏹️ Stop Recording
    </button>
  </div>

  <div id="status">
    Ready to record
  </div>

  <div class="conversation-title">
    Conversation
  </div>

  <div id="conversationBox">
    Your conversation will appear here after transcription.
  </div>

</div>

<!--
  HIDDEN APPS SCRIPT BRIDGE

  IMPORTANT:
  This is the NEW Apps Script URL supplied by you.
-->
<iframe
  id="bridgeFrame"
  src="https://script.google.com/macros/s/AKfycbzfD-Rd2gNhV-5izmNgAoSrbOpeXeYezZXon961Ece-2RawVq7U8dnJ2W7LUGfvNbgLsA/exec"
  allow="microphone"
></iframe>


<script>

const startBtn =
  document.getElementById("startBtn");

const stopBtn =
  document.getElementById("stopBtn");

const statusBox =
  document.getElementById("status");

const conversationBox =
  document.getElementById("conversationBox");

const studentNameInput =
  document.getElementById("studentName");

const gradeInput =
  document.getElementById("grade");

const dateInput =
  document.getElementById("date");

const bridgeFrame =
  document.getElementById("bridgeFrame");


/* --------------------------------------------------
   SET TODAY'S DATE
-------------------------------------------------- */

const today =
  new Date();

const yyyy =
  today.getFullYear();

const mm =
  String(today.getMonth() + 1)
    .padStart(2, "0");

const dd =
  String(today.getDate())
    .padStart(2, "0");

dateInput.value =
  yyyy + "-" + mm + "-" + dd;


/* --------------------------------------------------
   VARIABLES
-------------------------------------------------- */

let mediaRecorder = null;

let audioChunks = [];

let audioStream = null;

let bridgeReady = false;


/* --------------------------------------------------
   BRIDGE MESSAGE LISTENER
-------------------------------------------------- */

window.addEventListener(
  "message",
  function(event) {

    const data =
      event.data;

    if (!data) {
      return;
    }

    console.log(
      "GitHub received:",
      data.type
    );


    /* --------------------------------------------
       BRIDGE READY
    -------------------------------------------- */

    if (
      data.type ===
      "BOMIS_BRIDGE_READY"
    ) {

      bridgeReady = true;

      console.log(
        "BOMIS Bridge is ready."
      );

      return;
    }


    /* --------------------------------------------
       PROCESSING
    -------------------------------------------- */

    if (
      data.type ===
      "BOMIS_PROCESSING"
    ) {

      statusBox.textContent =
        "🤖 Processing conversation... Please wait.";

      return;
    }


    /* --------------------------------------------
       RESULT
    -------------------------------------------- */

    if (
      data.type ===
      "BOMIS_RESULT"
    ) {

      const result =
        data.result;

      console.log(
        "BOMIS result:",
        result
      );


      if (
        result &&
        result.success
      ) {

        conversationBox.textContent =
          result.transcript || "";

        statusBox.textContent =
          "✅ Conversation saved successfully to Google Sheet.";

      } else {

        statusBox.textContent =
          "❌ Error: " +
          (
            result &&
            result.error
              ? result.error
              : "Unknown error"
          );

      }

      startBtn.disabled = false;
      stopBtn.disabled = true;

    }

  }
);


/* --------------------------------------------------
   START RECORDING
-------------------------------------------------- */

startBtn.addEventListener(
  "click",
  async function() {

    try {

      const studentName =
        studentNameInput.value.trim();

      const grade =
        gradeInput.value.trim();

      if (!studentName) {

        alert(
          "Please enter Student Name."
        );

        return;
      }

      if (!grade) {

        alert(
          "Please enter Grade."
        );

        return;
      }


      statusBox.textContent =
        "🎙️ Requesting microphone permission...";


      audioStream =
        await navigator.mediaDevices.getUserMedia({
          audio: true
        });


      audioChunks = [];


      let options = {};

      if (
        MediaRecorder.isTypeSupported(
          "audio/webm;codecs=opus"
        )
      ) {

        options.mimeType =
          "audio/webm;codecs=opus";

      } else if (
        MediaRecorder.isTypeSupported(
          "audio/webm"
        )
      ) {

        options.mimeType =
          "audio/webm";

      }


      mediaRecorder =
        new MediaRecorder(
          audioStream,
          options
        );


      mediaRecorder.ondataavailable =
        function(event) {

          if (
            event.data &&
            event.data.size > 0
          ) {

            audioChunks.push(
              event.data
            );

          }

        };


      mediaRecorder.onstop =
        function() {

          stopProcessing();

        };


      mediaRecorder.start();


      startBtn.disabled = true;

      stopBtn.disabled = false;


      statusBox.textContent =
        "🔴 Recording conversation...";

    } catch (error) {

      console.error(
        error
      );

      statusBox.textContent =
        "❌ Microphone error: " +
        error.message;

      startBtn.disabled = false;
      stopBtn.disabled = true;

    }

  }
);


/* --------------------------------------------------
   STOP RECORDING
-------------------------------------------------- */

stopBtn.addEventListener(
  "click",
  function() {

    if (
      mediaRecorder &&
      mediaRecorder.state !==
      "inactive"
    ) {

      statusBox.textContent =
        "⏳ Stopping recording...";

      mediaRecorder.stop();

    }

    if (audioStream) {

      audioStream
        .getTracks()
        .forEach(
          function(track) {

            track.stop();

          }
        );

    }

    stopBtn.disabled = true;

  }
);


/* --------------------------------------------------
   PROCESS STOPPED AUDIO
-------------------------------------------------- */

function stopProcessing() {

  statusBox.textContent =
    "⏳ Preparing audio...";


  const audioBlob =
    new Blob(
      audioChunks,
      {
        type:
          mediaRecorder.mimeType ||
          "audio/webm"
      }
    );


  console.log(
    "Audio blob size:",
    audioBlob.size
  );


  if (
    audioBlob.size === 0
  ) {

    statusBox.textContent =
      "❌ No audio was recorded.";

    startBtn.disabled = false;

    return;

  }


  /* --------------------------------------------
     DOWNLOAD AUDIO LOCALLY
  -------------------------------------------- */

  const studentName =
    studentNameInput.value.trim()
      .replace(
        /[^a-zA-Z0-9_-]/g,
        "_"
      );

  const grade =
    gradeInput.value.trim()
      .replace(
        /[^a-zA-Z0-9_-]/g,
        "_"
      );


  const audioUrl =
    URL.createObjectURL(
      audioBlob
    );


  const downloadLink =
    document.createElement("a");

  downloadLink.href =
    audioUrl;

  downloadLink.download =
    "BOMIS_" +
    studentName +
    "_" +
    grade +
    "_Conversation.webm";

  document.body.appendChild(
    downloadLink
  );

  downloadLink.click();

  document.body.removeChild(
    downloadLink
  );

  setTimeout(
    function() {

      URL.revokeObjectURL(
        audioUrl
      );

    },
    1000
  );


  /* --------------------------------------------
     CONVERT AUDIO TO DATA URL
  -------------------------------------------- */

  const reader =
    new FileReader();


  reader.onloadend =
    function() {

      const dataUrl =
        reader.result;


      console.log(
        "Data URL length:",
        dataUrl.length
      );


      statusBox.textContent =
        "⏳ Sending conversation for transcription...";


      sendAudioToBridge(
        dataUrl,
        audioBlob.type ||
          "audio/webm"
      );

    };


  reader.onerror =
    function(error) {

      console.error(
        error
      );

      statusBox.textContent =
        "❌ Could not prepare audio.";

      startBtn.disabled = false;

    };


  reader.readAsDataURL(
    audioBlob
  );

}
