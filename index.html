<body>

<div class="container">

  <h1>BOMIS Conversation</h1>

  <div class="subtitle">
    Student Conversation Recorder
  </div>


  <label>Student Name</label>

  <input
    id="studentName"
    type="text"
    placeholder="Enter student name"
  >


  <label>Grade</label>

  <input
    id="grade"
    type="text"
    placeholder="Enter grade"
  >


  <label>Date</label>

  <input
    id="date"
    type="date"
  >


  <div class="buttons">

    <button
      id="startBtn"
      onclick="startRecording()"
    >
      🎙 Start Recording
    </button>

    <button
      id="stopBtn"
      onclick="stopRecording()"
      disabled
    >
      ⏹ Stop Recording
    </button>

    <button
      id="downloadBtn"
      onclick="downloadAudio()"
      disabled
    >
      ⬇ Download Audio
    </button>

  </div>


  <div id="statusBox">
    Connecting to BOMIS server...
  </div>


  <div class="title">
    Conversation
  </div>

  <div id="conversationBox">
    Conversation will appear here after recording.
  </div>

</div>


<!-- =====================================================
     APPS SCRIPT BRIDGE
===================================================== -->

<iframe
  id="bridgeFrame"
  src="https://script.google.com/macros/s/AKfycby4QSe_GgfQINvLb_T5Z6BtzoMNa6Qc14vlKSU6XTrfvM2iH1vBE-ugxnW1DAJzgnZ2eg/exec"
  allow="microphone">
</iframe>


<script>


/* =========================================================
   VARIABLES
========================================================= */

let bridgeReady = false;

let mediaRecorder = null;

let audioChunks = [];

let audioBlob = null;

let audioMimeType = "audio/webm";

let processing = false;


/* =========================================================
   ELEMENTS
========================================================= */

const bridgeFrame =
  document.getElementById("bridgeFrame");

const startBtn =
  document.getElementById("startBtn");

const stopBtn =
  document.getElementById("stopBtn");

const downloadBtn =
  document.getElementById("downloadBtn");

const statusBox =
  document.getElementById("statusBox");

const conversationBox =
  document.getElementById("conversationBox");


/* =========================================================
   TODAY'S DATE
========================================================= */

const today =
  new Date();

document.getElementById("date").value =
  today.getFullYear() +
  "-" +
  String(today.getMonth() + 1).padStart(2, "0") +
  "-" +
  String(today.getDate()).padStart(2, "0");


/* =========================================================
   MESSAGE FROM BRIDGE
========================================================= */

window.addEventListener(
  "message",
  function(event) {

    const data = event.data;

    if (!data) {
      return;
    }


    console.log(
      "GitHub received:",
      data
    );


    /* -----------------------------------------------------
       BRIDGE READY
    ----------------------------------------------------- */

    if (
      data.type ===
      "BOMIS_BRIDGE_READY"
    ) {

      bridgeReady = true;

      statusBox.innerText =
        "Connected. Ready to record.";

      statusBox.style.background =
        "#d1e7dd";

      console.log(
        "BOMIS Bridge READY"
      );

      return;
    }


    /* -----------------------------------------------------
       PROCESSING
    ----------------------------------------------------- */

    if (
      data.type ===
      "BOMIS_PROCESSING"
    ) {

      processing = true;

      statusBox.innerText =
        "Processing conversation...";

      statusBox.style.background =
        "#fff3cd";

      startBtn.disabled =
        true;

      stopBtn.disabled =
        true;

      return;
    }


    /* -----------------------------------------------------
       FINAL RESULT
    ----------------------------------------------------- */

    if (
      data.type ===
      "BOMIS_RESULT"
    ) {

      processing = false;

      const result =
        data.result;


      console.log(
        "Final result:",
        result
      );


      if (
        result &&
        result.success
      ) {

        conversationBox.innerText =
          result.transcript ||
          "No speech detected.";


        statusBox.innerText =
          "✓ Conversation saved successfully.";

        statusBox.style.background =
          "#d1e7dd";

        startBtn.disabled =
          false;

      }

      else {

        conversationBox.innerText =
          "ERROR:\n\n" +
          (
            result &&
            result.error
              ? result.error
              : "Unknown error"
          );


        statusBox.innerText =
          "Error processing conversation.";

        statusBox.style.background =
          "#f8d7da";

        startBtn.disabled =
          false;

      }

      return;
    }

  }
);


/* =========================================================
   BRIDGE HANDSHAKE
========================================================= */

function pingBridge() {

  if (
    bridgeFrame &&
    bridgeFrame.contentWindow
  ) {

    console.log(
      "Sending ping to Bridge..."
    );

    bridgeFrame
      .contentWindow
      .postMessage(
        {
          type: "BOMIS_PING"
        },
        "*"
      );

  }

}


/*
  Ping repeatedly because the Apps Script iframe can take
  several seconds to load.
*/

setInterval(
  pingBridge,
  1000
);


/*
  First ping.
*/

setTimeout(
  pingBridge,
  500
);


/* =========================================================
   START RECORDING
========================================================= */

async function startRecording() {


  if (processing) {
    return;
  }


  const studentName =
    document
      .getElementById("studentName")
      .value
      .trim();


  const grade =
    document
      .getElementById("grade")
      .value
      .trim();


  if (!studentName) {

    alert(
      "Please enter the student name."
    );

    return;
  }


  if (!grade) {

    alert(
      "Please enter the grade."
    );

    return;
  }


  if (!navigator.mediaDevices) {

    alert(
      "Microphone is not supported by this browser."
    );

    return;
  }


  try {

    statusBox.innerText =
      "Requesting microphone permission...";


    const stream =
      await navigator
        .mediaDevices
        .getUserMedia({
          audio: true
        });


    console.log(
      "Microphone permission granted."
    );


    /* -----------------------------------------------------
       FIND AUDIO FORMAT
    ----------------------------------------------------- */

    let options = {};

    const formats = [

      "audio/webm;codecs=opus",

      "audio/webm",

      "audio/ogg;codecs=opus"

    ];


    for (
      let i = 0;
      i < formats.length;
      i++
    ) {

      if (
        MediaRecorder.isTypeSupported(
          formats[i]
        )
      ) {

        options.mimeType =
          formats[i];

        break;
      }

    }


    /* -----------------------------------------------------
       CREATE RECORDER
    ----------------------------------------------------- */

    try {

      mediaRecorder =
        new MediaRecorder(
          stream,
          options
        );

    }

    catch(error) {

      mediaRecorder =
        new MediaRecorder(
          stream
        );

    }


    audioMimeType =
      mediaRecorder.mimeType ||
      "audio/webm";


    audioChunks = [];

    audioBlob = null;


    /* -----------------------------------------------------
       AUDIO DATA
    ----------------------------------------------------- */

    mediaRecorder.ondataavailable =
      function(event) {

        if (
          event.data &&
          event.data.size > 0
        ) {

          audioChunks.push(
            event.data
          );

        }

      };


    /* -----------------------------------------------------
       STOP
    ----------------------------------------------------- */

    mediaRecorder.onstop =
      function() {

        console.log(
          "Recording stopped."
        );


        audioBlob =
          new Blob(
            audioChunks,
            {
              type:
                audioMimeType
            }
          );


        console.log(
          "Audio size:",
          audioBlob.size
        );


        if (
          audioBlob.size === 0
        ) {

          statusBox.innerText =
            "Recording was empty.";

          return;
        }


        downloadBtn.disabled =
          false;


        stream
          .getTracks()
          .forEach(
            function(track) {
              track.stop();
            }
          );


        statusBox.innerText =
          "Preparing audio...";


        /* -------------------------------------------------
           CONVERT TO DATA URL
        ------------------------------------------------- */

        const reader =
          new FileReader();


        reader.onloadend =
          function() {

            const dataUrl =
              reader.result;


            console.log(
              "Data URL length:",
              dataUrl
                ? dataUrl.length
                : 0
            );


            if (!dataUrl) {

              statusBox.innerText =
                "Could not prepare audio.";

              return;
            }


            const studentName =
              document
                .getElementById("studentName")
                .value
                .trim();


            const grade =
              document
                .getElementById("grade")
                .value
                .trim();


            const date =
              document
                .getElementById("date")
                .value;


            /* ---------------------------------------------
               CHECK BRIDGE
            --------------------------------------------- */

            if (!bridgeReady) {

              statusBox.innerText =
                "Bridge is still connecting. Please wait a moment and try again.";

              statusBox.style.background =
                "#fff3cd";

              startBtn.disabled =
                false;

              return;
            }


            /* ---------------------------------------------
               SEND TO BRIDGE
            --------------------------------------------- */

            statusBox.innerText =
              "Sending audio for transcription...";


            statusBox.style.background =
              "#fff3cd";


            bridgeFrame
              .contentWindow
              .postMessage(

                {

                  type:
                    "PROCESS_AUDIO",

                  audioDataUrl:
                    dataUrl,

                  mimeType:
                    audioMimeType,

                  studentName:
                    studentName,

                  grade:
                    grade,

                  date:
                    date

                },

                "*"

              );


            console.log(
              "Audio sent to Bridge."
            );

          };


        reader.onerror =
          function(error) {

            console.error(
              error
            );

            statusBox.innerText =
              "Error reading audio.";

          };


        reader.readAsDataURL(
          audioBlob
        );

      };


    /* -----------------------------------------------------
       START
    ----------------------------------------------------- */

    mediaRecorder.start(1000);


    startBtn.disabled =
      true;

    stopBtn.disabled =
      false;

    downloadBtn.disabled =
      true;


    statusBox.innerText =
      "🔴 Recording...";

    statusBox.style.background =
      "#f8d7da";


    conversationBox.innerText =
      "Recording conversation...";


  }

  catch(error) {

    console.error(
      "Microphone error:",
      error
    );


    statusBox.innerText =
      "Microphone error: " +
      error.message;

    statusBox.style.background =
      "#f8d7da";

    alert(
      "Please allow microphone access in Chrome."
    );

  }

}


/* =========================================================
   STOP RECORDING
========================================================= */

function stopRecording() {

  if (
    mediaRecorder &&
    mediaRecorder.state !== "inactive"
  ) {

    statusBox.innerText =
      "Stopping recording...";

    mediaRecorder.stop();

    stopBtn.disabled =
      true;

    startBtn.disabled =
      true;

  }

}


/* =========================================================
   DOWNLOAD AUDIO
========================================================= */

function downloadAudio() {

  if (!audioBlob) {

    alert(
      "No recording available."
    );

    return;
  }


  const studentName =
    document
      .getElementById("studentName")
      .value
      .trim() ||
    "Student";


  const grade =
    document
      .getElementById("grade")
      .value
      .trim() ||
    "Grade";


  const safeName =
    studentName.replace(
      /[^a-zA-Z0-9_-]/g,
      "_"
    );


  const safeGrade =
    grade.replace(
      /[^a-zA-Z0-9_-]/g,
      "_"
    );


  let extension =
    "webm";


  if (
    audioMimeType.includes("ogg")
  ) {

    extension =
      "ogg";

  }


  const fileName =
    safeName +
    "_" +
    safeGrade +
    "_Conversation." +
    extension;


  const url =
    URL.createObjectURL(
      audioBlob
    );


  const link =
    document.createElement("a");


  link.href =
    url;

  link.download =
    fileName;


  document
    .body
    .appendChild(link);


  link.click();


  link.remove();


  setTimeout(
    function() {

      URL.revokeObjectURL(
        url
      );

    },
    1000
  );

}


/* =========================================================
   INITIAL STATE
========================================================= */

startBtn.disabled =
  true;

stopBtn.disabled =
  true;

downloadBtn.disabled =
  true;


/*
  We intentionally enable Start only after the bridge
  confirms its connection.
*/

</script>

</body>
</html>
