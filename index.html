<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>BOMIS Conversation</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    .container {
      max-width: 850px;
      margin: 20px auto;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.10);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 25px;
    }

    button {
      flex: 1;
      min-width: 150px;
      padding: 14px 18px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #startBtn {
      background: #198754;
      color: white;
    }

    #stopBtn {
      background: #dc3545;
      color: white;
    }

    #downloadBtn {
      background: #0d6efd;
      color: white;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    #statusBox {
      margin-top: 20px;
      padding: 14px;
      border-radius: 8px;

    }

    .conversation-title {
      margin-top: 30px;

    }

    #conversationBox {
      min-height: 250px;
      max-height: 500px;
      overflow-y: auto;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 18px;
      background: #fafafa;
      white-space: pre-wrap;

    .info {
      margin-top: 20px;
      padding: 12px;
      background: #fff8e1;
      border-radius: 8px;
      font-size: 14px;
      color: #555;
    }

    /*
      Hidden Apps Script bridge
    */

    #bridgeFrame {
      position: fixed;
      width: 1px;
      height: 1px;
      left: -1000px;
      top: -1000px;
      border: 0;
      opacity: 0;
      pointer-events: none;
    }

  </style>

</head>


<body>


<div class="container">

  <h1>BOMIS Conversation</h1>

  <div class="subtitle">
    Student Conversation Recorder
  </div>


  <!-- STUDENT NAME -->

  <label for="studentName">
    Student Name
  </label>

  <input
    type="text"
    id="studentName"
    placeholder="Enter student name"
  >


  <!-- GRADE -->

  <label for="grade">
    Grade
  </label>

  <input
    type="text"
    id="grade"
    placeholder="Enter grade"
  >


  <!-- DATE -->

  <label for="date">
    Date
  </label>

  <input
    type="date"
    id="date"
  >


  <!-- BUTTONS -->

  <div class="buttons">

    <button
      id="startBtn"
      onclick="startRecording()"
    >
      🎙 Start Recording
    </button>


    <button
      id="stopBtn"
      onclick="stopRecording()"
      disabled
    >
      ⏹ Stop Recording
    </button>


    <button
      id="downloadBtn"
      onclick="downloadAudio()"
      disabled
    >
      ⬇ Download Audio
    </button>

  </div>


  <!-- STATUS -->

  <div id="statusBox">
    Ready to record.
  </div>


  <!-- CONVERSATION -->

  <div class="conversation-title">
    Conversation
  </div>

  <div id="conversationBox">
    Your conversation will appear here after recording.
  </div>


  <div class="info">

    Speak normally with the student.
    The system will identify different speakers
    when Deepgram provides speaker information.

  </div>

</div>


<!-- =====================================================
     APPS SCRIPT BRIDGE
===================================================== -->

<iframe
  id="bridgeFrame"
  src="https://script.google.com/macros/s/AKfycby4QSe_GgfQINvLb_T5Z6BtzoMNa6Qc14vlKSU6XTrfvM2iH1vBE-ugxnW1DAJzgnZ2eg/exec"
  allow="microphone">
</iframe>


<script>


/* =========================================================
   VARIABLES
========================================================= */

let mediaRecorder = null;

let audioChunks = [];

let audioBlob = null;

let audioMimeType = "audio/webm";

let bridgeReady = false;

let processing = false;


/* =========================================================
   ELEMENTS
========================================================= */

const startBtn =
  document.getElementById("startBtn");

const stopBtn =
  document.getElementById("stopBtn");

const downloadBtn =
  document.getElementById("downloadBtn");

const statusBox =
  document.getElementById("statusBox");

const conversationBox =
  document.getElementById("conversationBox");

const bridgeFrame =
  document.getElementById("bridgeFrame");


/* =========================================================
   DATE
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    const dateInput =
      document.getElementById("date");

    if (!dateInput.value) {

      const today = new Date();

      const year =
        today.getFullYear();

      const month =
        String(
          today.getMonth() + 1
        ).padStart(2, "0");

      const day =
        String(
          today.getDate()
        ).padStart(2, "0");

      dateInput.value =
        year + "-" +
        month + "-" +
        day;
    }

  }
);


/* =========================================================
   BRIDGE MESSAGE LISTENER
========================================================= */

window.addEventListener(
  "message",
  function(event) {

    const data =
      event.data;

    if (!data) {
      return;
    }


    /* -----------------------------------------------------
       BRIDGE READY
    ----------------------------------------------------- */

    if (
      data.type ===
      "BOMIS_BRIDGE_READY"
    ) {

      bridgeReady = true;

      console.log(
        "BOMIS Bridge is connected."
      );

      /*
        Don't change the recording button here.
        It is already enabled.
      */

      if (!processing) {

        statusBox.innerText =
          "Ready to record.";

      }

      return;
    }


    /* -----------------------------------------------------
       PROCESSING
    ----------------------------------------------------- */

    if (
      data.type ===
      "BOMIS_PROCESSING"
    ) {

      processing = true;

      statusBox.innerText =
        "Processing conversation... Please wait.";

      statusBox.style.background =
        "#fff3cd";

      startBtn.disabled = true;

      stopBtn.disabled = true;

      return;
    }


    /* -----------------------------------------------------
       RESULT
    ----------------------------------------------------- */

    if (
      data.type ===
      "BOMIS_RESULT"
    ) {

      processing = false;

      const result =
        data.result;


      console.log(
        "BOMIS RESULT:",
        result
      );


      if (
        result &&
        result.success
      ) {

        conversationBox.innerText =
          result.transcript ||
          "No conversation detected.";


        statusBox.innerText =
          "Conversation saved successfully.";

        statusBox.style.background =
          "#d1e7dd";


        startBtn.disabled =
          false;

      }

      else {

        const errorMessage =
          result &&
          result.error
            ? result.error
            : "Unknown error occurred.";


        conversationBox.innerText =
          "Error:\n\n" +
          errorMessage;


        statusBox.innerText =
          "Error while processing.";

        statusBox.style.background =
          "#f8d7da";


        startBtn.disabled =
          false;

      }

      return;
    }

  }
);


/* =========================================================
   KEEP CONTACTING BRIDGE
========================================================= */

setInterval(
  function() {

    try {

      if (
        bridgeFrame &&
        bridgeFrame.contentWindow
      ) {

        bridgeFrame
          .contentWindow
          .postMessage(
            {
              type: "BOMIS_PING"
            },
            "*"
          );

      }

    }

    catch(error) {

      console.log(
        "Bridge ping error:",
        error
      );

    }

  },
  1000
);


/* =========================================================
   START RECORDING
========================================================= */

async function startRecording() {


  if (processing) {

    return;

  }


  /* -------------------------------------------------------
     STUDENT NAME
  ------------------------------------------------------- */

  const studentName =
    document
      .getElementById("studentName")
      .value
      .trim();


  if (!studentName) {

    alert(
      "Please enter the student name."
    );

    return;

  }


  /* -------------------------------------------------------
     GRADE
  ------------------------------------------------------- */

  const grade =
    document
      .getElementById("grade")
      .value
      .trim();


  if (!grade) {

    alert(
      "Please enter the grade."
    );

    return;

  }


  /* -------------------------------------------------------
     MICROPHONE
  ------------------------------------------------------- */

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    alert(
      "Your browser does not support microphone recording."
    );

    return;

  }


  try {

    statusBox.innerText =
      "Requesting microphone permission...";

    statusBox.style.background =
      "#fff3cd";


    const stream =
      await navigator
        .mediaDevices
        .getUserMedia({
          audio: true
        });


    console.log(
      "Microphone access granted."
    );


    /* -----------------------------------------------------
       AUDIO FORMAT
    ----------------------------------------------------- */

    let options = {};

    const possibleTypes = [

      "audio/webm;codecs=opus",

      "audio/webm",

      "audio/ogg;codecs=opus",

      "audio/mp4"

    ];


    for (
      let i = 0;
      i < possibleTypes.length;
      i++
    ) {

      if (
        MediaRecorder.isTypeSupported(
          possibleTypes[i]
        )
      ) {

        options.mimeType =
          possibleTypes[i];

        break;

      }

    }


    /* -----------------------------------------------------
       CREATE RECORDER
    ----------------------------------------------------- */

    try {

      mediaRecorder =
        new MediaRecorder(
          stream,
          options
        );

    }

    catch(error) {

      console.log(
        "Preferred format unavailable. Using default."
      );

      mediaRecorder =
        new MediaRecorder(
          stream
        );

    }


    audioMimeType =
      mediaRecorder.mimeType ||
      options.mimeType ||
      "audio/webm";


    audioChunks = [];

    audioBlob = null;


    /* -----------------------------------------------------
       AUDIO DATA
    ----------------------------------------------------- */

    mediaRecorder.ondataavailable =
      function(event) {

        if (
          event.data &&
          event.data.size > 0
        ) {

          audioChunks.push(
            event.data
          );

        }

      };


    /* -----------------------------------------------------
       RECORDING STOPPED
    ----------------------------------------------------- */

    mediaRecorder.onstop =
      async function() {

        try {

          audioBlob =
            new Blob(
              audioChunks,
              {
                type:
                  audioMimeType
              }
            );


          console.log(
            "Audio blob size:",
            audioBlob.size
          );


          if (audioBlob.size === 0) {

            throw new Error(
              "The recording is empty."
            );

          }


          downloadBtn.disabled =
            false;


          /*
            Stop microphone.
          */

          stream
            .getTracks()
            .forEach(
              function(track) {
                track.stop();
              }
            );


          statusBox.innerText =
            "Preparing conversation...";

          statusBox.style.background =
            "#fff3cd";


          /* ------------------------------------------------
             CONVERT AUDIO TO DATA URL
          ------------------------------------------------ */

          const reader =
            new FileReader();


          reader.onloadend =
            function() {

              const dataUrl =
                reader.result;


              console.log(
                "Audio Data URL created."
              );


              console.log(
                "Data URL length:",
                dataUrl
                  ? dataUrl.length
                  : 0
              );


              if (!dataUrl) {

                statusBox.innerText =
                  "Could not prepare audio.";

                return;

              }


              /* --------------------------------------------
                 FORM DATA
              -------------------------------------------- */

              const studentName =
                document
                  .getElementById("studentName")
                  .value
                  .trim();


              const grade =
                document
                  .getElementById("grade")
                  .value
                  .trim();


              const date =
                document
                  .getElementById("date")
                  .value;


              /* --------------------------------------------
                 SEND TO BRIDGE
              -------------------------------------------- */

              statusBox.innerText =
                "Sending audio for transcription...";


              statusBox.style.background =
                "#fff3cd";


              if (
                bridgeFrame &&
                bridgeFrame.contentWindow
              ) {

                bridgeFrame
                  .contentWindow
                  .postMessage(

                    {

                      type:
                        "PROCESS_AUDIO",

                      audioDataUrl:
                        dataUrl,

                      mimeType:
                        audioMimeType,

                      studentName:
                        studentName,

                      grade:
                        grade,

                      date:
                        date

                    },

                    "*"

                  );


                console.log(
                  "Audio sent to Apps Script bridge."
                );


                /*
                  Give the bridge a little time.
                  If it doesn't respond, show a useful message.
                */

                setTimeout(
                  function() {

                    if (
                      !processing
                    ) {

                      statusBox.innerText =
                        "Audio sent. Waiting for transcription...";

                    }

                  },
                  3000
                );

              }

              else {

                statusBox.innerText =
                  "Apps Script bridge is not available.";

                statusBox.style.background =
                  "#f8d7da";

              }

            };


          reader.onerror =
            function(error) {

              console.error(
                "FileReader error:",
                error
              );

              statusBox.innerText =
                "Error converting recording.";

              statusBox.style.background =
                "#f8d7da";

            };


          reader.readAsDataURL(
            audioBlob
          );

        }

        catch(error) {

          console.error(
            "Recording stop error:",
            error
          );

          statusBox.innerText =
            "Error: " +
            error.message;

          statusBox.style.background =
            "#f8d7da";

        }

      };


    /* -----------------------------------------------------
       START
    ----------------------------------------------------- */

    mediaRecorder.start(1000);


    startBtn.disabled =
      true;

    stopBtn.disabled =
      false;

    downloadBtn.disabled =
      true;


    statusBox.innerText =
      "🔴 Recording... Speak with the student.";

    statusBox.style.background =
      "#f8d7da";


    conversationBox.innerText =
      "Recording conversation...";


  }

  catch(error) {

    console.error(
      "Microphone error:",
      error
    );


    statusBox.innerText =
      "Microphone error: " +
      error.message;

    statusBox.style.background =
      "#f8d7da";


    alert(
      "Microphone access was not granted. Please allow microphone access in Chrome."
    );

  }

}


/* =========================================================
   STOP RECORDING
========================================================= */

function stopRecording() {


  if (
    mediaRecorder &&
    mediaRecorder.state !== "inactive"
  ) {

    statusBox.innerText =
      "Stopping recording...";


    mediaRecorder.stop();


    stopBtn.disabled =
      true;

    startBtn.disabled =
      true;

  }

}


/* =========================================================
   DOWNLOAD AUDIO
========================================================= */

function downloadAudio() {


  if (!audioBlob) {

    alert(
      "No recording is available."
    );

    return;

  }


  const studentName =
    document
      .getElementById("studentName")
      .value
      .trim() ||
    "Student";


  const grade =
    document
      .getElementById("grade")
      .value
      .trim() ||
    "Grade";


  const cleanStudentName =
    studentName.replace(
      /[^a-zA-Z0-9_-]/g,
      "_"
    );


  const cleanGrade =
    grade.replace(
      /[^a-zA-Z0-9_-]/g,
      "_"
    );


  let extension = "webm";


  if (
    audioMimeType.includes("ogg")
  ) {

    extension = "ogg";

  }

  else if (
    audioMimeType.includes("mp4")
  ) {

    extension = "mp4";

  }


  const fileName =
    cleanStudentName +
    "_" +
    cleanGrade +
    "_Conversation." +
    extension;


  const audioUrl =
    URL.createObjectURL(
      audioBlob
    );


  const link =
    document.createElement("a");


  link.href =
    audioUrl;

  link.download =
    fileName;


  document
    .body
    .appendChild(link);


  link.click();


  link.remove();


  setTimeout(
    function() {

      URL.revokeObjectURL(
        audioUrl
      );

    },
    1000
  );

}


/* =========================================================
   INITIAL STATE
========================================================= */

startBtn.disabled = false;

stopBtn.disabled = true;

downloadBtn.disabled = true;

statusBox.innerText =
  "Ready to record.";

console.log(
  "BOMIS Conversation loaded."
);

</script>


</body>

</html>
