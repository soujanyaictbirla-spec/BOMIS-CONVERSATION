<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>BOMIS Conversation</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 15px;
      font-family: Arial, sans-serif;
      background: #f4f7f5;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 720px;
      margin: auto;
      background: white;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.10);
    }

    .title {
      text-align: center;
      margin-bottom: 25px;
    }

    .title h1 {
      margin: 0;
      color: #176b3a;
      font-size: 30px;
    }

    .title p {
      margin-top: 8px;
      color: #666;
      font-size: 15px;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      background: white;
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 25px;
    }

    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #startBtn {
      background: #16833d;
      color: white;
    }

    #startBtn:hover {
      background: #116b31;
    }

    #stopBtn {
      background: #d93636;
      color: white;
    }

    #stopBtn:hover {
      background: #b92828;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      margin-top: 22px;
      padding: 13px;
      border-radius: 8px;
      background: #f1f5f2;
      text-align: center;
      font-weight: bold;
    }

    .conversation-title {
      margin-top: 25px;
      margin-bottom: 8px;
      font-weight: bold;
    }

    #conversationBox {
      width: 100%;
      min-height: 220px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #fafafa;
      white-space: pre-wrap;
      overflow-y: auto;
      line-height: 1.6;
      font-size: 15px;
    }

    #downloadLink {
      display: none;
      margin-top: 18px;
      padding: 12px;
      text-align: center;
      border-radius: 8px;
      background: #176b3a;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .timer {
      text-align: center;
      margin-top: 12px;
      font-size: 18px;
      font-weight: bold;
    }

  </style>

</head>


<body>


<div class="container">

  <div class="title">

    <h1>BOMIS Conversation</h1>

    <p>
      Student Conversation Recorder
    </p>

  </div>


  <!-- STUDENT NAME -->

  <label for="studentName">
    Student Name
  </label>

  <input
    type="text"
    id="studentName"
    placeholder="Enter student name"
  >


  <!-- GRADE -->

  <label for="grade">
    Grade
  </label>

  <select id="grade">

    <option value="">
      Select Grade
    </option>

    <option value="Grade 1">Grade 1</option>
    <option value="Grade 2">Grade 2</option>
    <option value="Grade 3">Grade 3</option>
    <option value="Grade 4">Grade 4</option>
    <option value="Grade 5">Grade 5</option>
    <option value="Grade 6">Grade 6</option>
    <option value="Grade 7">Grade 7</option>
    <option value="Grade 8">Grade 8</option>
    <option value="Grade 9">Grade 9</option>
    <option value="Grade 10">Grade 10</option>
    <option value="Grade 11">Grade 11</option>
    <option value="Grade 12">Grade 12</option>

  </select>


  <!-- BUTTONS -->

  <div class="buttons">

    <button
      id="startBtn"
      onclick="startRecording()"
    >
      🎙 Start Recording
    </button>


    <button
      id="stopBtn"
      onclick="stopRecording()"
      disabled
    >
      ⏹ Stop
    </button>

  </div>


  <div
    class="timer"
    id="timer"
  >
    00:00
  </div>


  <div
    class="status"
    id="status"
  >
    Ready to record
  </div>


  <div class="conversation-title">
    Conversation
  </div>


  <div id="conversationBox">
    Your conversation will appear here...
  </div>


  <a
    id="downloadLink"
    href="#"
    download="BOMIS_Conversation.txt"
  >
    Download Conversation
  </a>

</div>


<!--
=====================================================
HIDDEN FORM TARGET
=====================================================
-->

<iframe
  name="BOMIS_UPLOAD_FRAME"
  id="BOMIS_UPLOAD_FRAME"
  style="display:none;">
</iframe>


<script>


// =====================================================
// APPS SCRIPT URL
// =====================================================

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxxWDxkNVEKMwjX_89cSM8m-Z5NxFo7DItivW4VIlzXO2MkTH4F7q88foPbawE5h4ypnA/exec";


// =====================================================
// VARIABLES
// =====================================================

let mediaRecorder = null;

let audioChunks = [];

let recordingStream = null;

let recordingStartTime = null;

let timerInterval = null;

let currentJobId = null;

let pollingInterval = null;

let pollingCount = 0;


// =====================================================
// PAGE LOADED
// =====================================================

console.log(
  "===== BOMIS GITHUB APP LOADED ====="
);


// =====================================================
// STATUS
// =====================================================

function setStatus(message) {

  document.getElementById(
    "status"
  ).textContent = message;

}


// =====================================================
// START RECORDING
// =====================================================

async function startRecording() {

  try {

    const studentName =
      document.getElementById(
        "studentName"
      ).value.trim();


    const grade =
      document.getElementById(
        "grade"
      ).value;


    if (!studentName) {

      alert(
        "Please enter the student name."
      );

      return;
    }


    if (!grade) {

      alert(
        "Please select the grade."
      );

      return;
    }


    setStatus(
      "Requesting microphone..."
    );


    console.log(
      "STATUS: Requesting microphone..."
    );


    recordingStream =
      await navigator.mediaDevices
        .getUserMedia({
          audio: true
        });


    audioChunks = [];


    // ---------------------------------------------
    // MEDIA RECORDER
    // ---------------------------------------------

    let options = {};

    if (
      MediaRecorder.isTypeSupported(
        "audio/webm;codecs=opus"
      )
    ) {

      options.mimeType =
        "audio/webm;codecs=opus";

    } else if (
      MediaRecorder.isTypeSupported(
        "audio/webm"
      )
    ) {

      options.mimeType =
        "audio/webm";
    }


    mediaRecorder =
      new MediaRecorder(
        recordingStream,
        options
      );


    mediaRecorder.ondataavailable =
      function(event) {

        if (
          event.data &&
          event.data.size > 0
        ) {

          audioChunks.push(
            event.data
          );
        }

      };


    mediaRecorder.onstop =
      function() {

        console.log(
          "Recording stopped."
        );

        prepareRecording();

      };


    mediaRecorder.start();


    recordingStartTime =
      Date.now();


    startTimer();


    document.getElementById(
      "startBtn"
    ).disabled = true;


    document.getElementById(
      "stopBtn"
    ).disabled = false;


    setStatus(
      "🔴 Recording..."
    );


    console.log(
      "STATUS: 🔴 Recording..."
    );


    console.log(
      "Recording started."
    );

  }

  catch (error) {

    console.error(
      "Microphone error:",
      error
    );


    setStatus(
      "Microphone access failed."
    );


    alert(
      "Unable to access the microphone. Please allow microphone permission in Chrome."
    );

  }

}


// =====================================================
// STOP RECORDING
// =====================================================

function stopRecording() {

  if (
    !mediaRecorder ||
    mediaRecorder.state === "inactive"
  ) {

    return;
  }


  console.log(
    "Stopping recording..."
  );


  setStatus(
    "Preparing recording..."
  );


  mediaRecorder.stop();


  if (recordingStream) {

    recordingStream
      .getTracks()
      .forEach(
        function(track) {
          track.stop();
        }
      );
  }


  document.getElementById(
    "startBtn"
  ).disabled = false;


  document.getElementById(
    "stopBtn"
  ).disabled = true;


  stopTimer();

}


// =====================================================
// PREPARE RECORDING
// =====================================================

function prepareRecording() {

  console.log(
    "Preparing audio..."
  );


  const audioBlob =
    new Blob(
      audioChunks,
      {
        type:
          mediaRecorder.mimeType ||
          "audio/webm"
      }
    );


  console.log(
    "Audio size:",
    audioBlob.size
  );


  if (
    audioBlob.size === 0
  ) {

    setStatus(
      "No audio was recorded."
    );

    return;
  }


  setStatus(
    "Converting recording..."
  );


  const reader =
    new FileReader();


  reader.onloadend =
    function() {

      const dataUrl =
        reader.result;


      console.log(
        "Data URL created."
      );


      console.log(
        "Data URL length:",
        dataUrl.length
      );


      sendAudioToAppsScript(
        dataUrl,
        audioBlob.type
      );

    };


  reader.readAsDataURL(
    audioBlob
  );

}


// =====================================================
// SEND AUDIO DIRECTLY TO APPS SCRIPT
// =====================================================

function sendAudioToAppsScript(
  dataUrl,
  mimeType
) {

  console.log(
    "Sending audio directly to Apps Script..."
  );


  // ---------------------------------------------
  // CREATE JOB ID
  // ---------------------------------------------

  currentJobId =
    "JOB_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2, 8);


  console.log(
    "Job ID:",
    currentJobId
  );


  // ---------------------------------------------
  // CREATE FORM
  // ---------------------------------------------

  const form =
    document.createElement(
      "form"
    );


  form.method =
    "POST";


  form.action =
    APPS_SCRIPT_URL;


  form.target =
    "BOMIS_UPLOAD_FRAME";


  form.style.display =
    "none";


  // ---------------------------------------------
  // BASE64 AUDIO
  // ---------------------------------------------

  const base64Audio =
    dataUrl.substring(
      dataUrl.indexOf(",") + 1
    );


  // ---------------------------------------------
  // CREATE INPUT
  // ---------------------------------------------

  function addInput(
    name,
    value
  ) {

    const input =
      document.createElement(
        "input"
      );


    input.type =
      "hidden";


    input.name =
      name;


    input.value =
      value;


    form.appendChild(
      input
    );
  }


  // ---------------------------------------------
  // ADD DATA
  // ---------------------------------------------

  addInput(
    "base64Audio",
    base64Audio
  );


  addInput(
    "mimeType",
    mimeType ||
    "audio/webm"
  );


  addInput(
    "studentName",
    document.getElementById(
      "studentName"
    ).value.trim()
  );


  addInput(
    "grade",
    document.getElementById(
      "grade"
    ).value
  );


  addInput(
    "date",
    new Date().toLocaleDateString(
      "en-IN"
    )
  );


  addInput(
    "jobId",
    currentJobId
  );


  // ---------------------------------------------
  // ADD FORM
  // ---------------------------------------------

  document.body.appendChild(
    form
  );


  setStatus(
    "Sending recording..."
  );


  console.log(
    "Submitting audio to Apps Script..."
  );


  // ---------------------------------------------
  // SUBMIT
  // ---------------------------------------------

  form.submit();


  console.log(
    "Audio submitted successfully."
  );


  setStatus(
    "⏳ Processing conversation..."
  );


  // ---------------------------------------------
  // START POLLING
  // ---------------------------------------------

  startResultPolling(
    currentJobId
  );


  // ---------------------------------------------
  // REMOVE FORM LATER
  // ---------------------------------------------

  setTimeout(
    function() {

      try {

        form.remove();

      } catch (error) {}

    },
    10000
  );

}


// =====================================================
// START RESULT POLLING
// =====================================================

function startResultPolling(
  jobId
) {

  if (
    pollingInterval
  ) {

    clearInterval(
      pollingInterval
    );
  }


  pollingCount = 0;


  console.log(
    "Starting result polling:",
    jobId
  );


  checkTranscript(
    jobId
  );


  pollingInterval =
    setInterval(
      function() {

        checkTranscript(
          jobId
        );

      },
      3000
    );

}


// =====================================================
// CHECK TRANSCRIPT
// =====================================================

function checkTranscript(
  jobId
) {

  pollingCount++;


  console.log(
    "Checking transcript...",
    pollingCount,
    jobId
  );


  const callbackName =
    "bomIsCallback_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() * 100000
    );


  const script =
    document.createElement(
      "script"
    );


  const url =
    APPS_SCRIPT_URL +
    "?action=result" +
    "&jobId=" +
    encodeURIComponent(
      jobId
    ) +
    "&callback=" +
    callbackName;


  window[callbackName] =
    function(response) {

      console.log(
        "Polling response:",
        response
      );


      // ---------------------------------------------
      // RESULT READY
      // ---------------------------------------------

      if (
        response &&
        response.ready
      ) {

        if (
          pollingInterval
        ) {

          clearInterval(
            pollingInterval
          );

          pollingInterval =
            null;
        }


        if (
          response.result &&
          response.result.success
        ) {

          showTranscript(
            response.result.transcript
          );

        } else {

          const errorMessage =
            response.result &&
            response.result.error
              ? response.result.error
              : "Unable to process recording.";


          setStatus(
            "❌ " +
            errorMessage
          );

        }


        cleanup();

        return;
      }


      // ---------------------------------------------
      // STILL PROCESSING
      // ---------------------------------------------

      setStatus(
        "⏳ Processing conversation..."
      );


      cleanup();

    };


  script.onerror =
    function() {

      console.warn(
        "Polling request failed. Retrying..."
      );


      cleanup();

    };


  script.src =
    url;


  document.body.appendChild(
    script
  );


  function cleanup() {

    try {

      script.remove();

    } catch (error) {}


    try {

      delete window[
        callbackName
      ];

    } catch (error) {}

  }

}


// =====================================================
// SHOW TRANSCRIPT
// =====================================================

function showTranscript(
  transcript
) {

  console.log(
    "Transcript received:",
    transcript
  );


  const box =
    document.getElementById(
      "conversationBox"
    );


  box.textContent =
    transcript ||
    "No conversation detected.";


  setStatus(
    "✅ Conversation saved successfully."
  );


  // ---------------------------------------------
  // DOWNLOAD TXT
  // ---------------------------------------------

  const blob =
    new Blob(
      [
        transcript || ""
      ],
      {
        type:
          "text/plain;charset=utf-8"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const link =
    document.getElementById(
      "downloadLink"
    );


  link.href =
    url;


  link.download =
    "BOMIS_" +
    (
      document.getElementById(
        "studentName"
      ).value.trim() ||
      "Student"
    ) +
    "_Conversation.txt";


  link.style.display =
    "block";

}


// =====================================================
// TIMER
// =====================================================

function startTimer() {

  const timer =
    document.getElementById(
      "timer"
    );


  timerInterval =
    setInterval(
      function() {

        const elapsed =
          Math.floor(
            (
              Date.now() -
              recordingStartTime
            ) / 1000
          );


        const minutes =
          Math.floor(
            elapsed / 60
          );


        const seconds =
          elapsed % 60;


        timer.textContent =
          String(minutes)
            .padStart(2, "0") +
          ":" +
          String(seconds)
            .padStart(2, "0");

      },
      1000
    );

}


// =====================================================
// STOP TIMER
// =====================================================

function stopTimer() {

  if (
    timerInterval
  ) {

    clearInterval(
      timerInterval
    );

    timerInterval =
      null;
  }

}


</script>


</body>

</html>
