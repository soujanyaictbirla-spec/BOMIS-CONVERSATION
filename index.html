
<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>BOMIS Conversation</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 25px;
    }

    .container {
      max-width: 850px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.10);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 12px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      padding: 12px 18px;
      margin: 15px 5px 5px 0;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    #startBtn {
      background: #2e7d32;
      color: white;
    }

    #stopBtn {
      background: #c62828;
      color: white;
    }

    #downloadBtn {
      background: #1565c0;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      margin-top: 15px;
      padding: 12px;
      background: #f1f3f4;
      border-radius: 8px;
      font-weight: bold;
    }

    .conversation {
      margin-top: 20px;
      min-height: 200px;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: #fafafa;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    iframe {
      display: none;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>🎙️ BOMIS CONVERSATION</h1>


  <!-- STUDENT NAME -->

  <label>Student Name</label>

  <input
    type="text"
    id="studentName"
    placeholder="Enter student name"
  >


  <!-- GRADE -->

  <label>Grade</label>

  <input
    type="text"
    id="grade"
    placeholder="Enter grade"
  >


  <!-- DATE -->

  <label>Date</label>

  <input
    type="date"
    id="date"
  >


  <!-- STATUS -->

  <div
    class="status"
    id="status"
  >
    Connecting to server...
  </div>


  <!-- BUTTONS -->

  <button id="startBtn">
    🎙️ Start Recording
  </button>

  <button
    id="stopBtn"
    disabled
  >
    ⏹️ Stop Recording
  </button>

  <button
    id="downloadBtn"
    disabled
  >
    ⬇️ Download Audio
  </button>


  <!-- CONVERSATION -->

  <h2>
    Conversation
  </h2>

  <div
    class="conversation"
    id="conversation"
  >
    Conversation will appear here...
  </div>

</div>


<!-- =====================================================
     HIDDEN APPS SCRIPT BRIDGE
     ===================================================== -->

<iframe
  id="bridge"
  src="https://script.google.com/macros/s/AKfycby4QSe_GgfQINvLb_T5Z6BtzoMNa6Qc14vlKSU6XTrfvM2iH1vBE-ugxnW1DAJzgnZ2eg/exec"
  allow="microphone">
</iframe>


<script>


// =====================================================
// VARIABLES
// =====================================================

let mediaRecorder = null;

let audioChunks = [];

let audioBlob = null;

let bridgeReady = false;


// =====================================================
// ELEMENTS
// =====================================================

const bridge =
  document.getElementById("bridge");

const startBtn =
  document.getElementById("startBtn");

const stopBtn =
  document.getElementById("stopBtn");

const downloadBtn =
  document.getElementById("downloadBtn");

const statusBox =
  document.getElementById("status");

const conversationBox =
  document.getElementById("conversation");


// =====================================================
// DATE
// =====================================================

document.getElementById("date").value =
  new Date()
    .toISOString()
    .split("T")[0];


// =====================================================
// LISTEN FOR APPS SCRIPT BRIDGE
// =====================================================

window.addEventListener(
  "message",
  function(event) {

    console.log(
      "MESSAGE FROM BRIDGE:",
      event.data
    );


    if (!event.data) {
      return;
    }


    // ===============================================
    // BRIDGE READY
    // ===============================================

    if (
      event.data.type ===
      "BOMIS_BRIDGE_READY"
    ) {

      bridgeReady = true;


      statusBox.innerText =
        "Bridge connected. Ready to record.";


      console.log(
        "BOMIS BRIDGE READY"
      );

    }


    // ===============================================
    // PROCESSING
    // ===============================================

    if (
      event.data.type ===
      "BOMIS_PROCESSING"
    ) {

      statusBox.innerText =
        "Transcribing conversation...";


      conversationBox.innerText =
        "⏳ Please wait...\n\n" +
        "Transcribing conversation...";

    }


    // ===============================================
    // RESULT
    // ===============================================

    if (
      event.data.type ===
      "BOMIS_RESULT"
    ) {

      const result =
        event.data.result;


      console.log(
        "RESULT FROM APPS SCRIPT:",
        result
      );


      if (
        result &&
        result.success
      ) {

        conversationBox.innerText =
          result.transcript ||
          "No conversation detected.";


        statusBox.innerText =
          "✅ Conversation saved successfully.";

      }


      else {

        conversationBox.innerText =
          "❌ " +
          (
            result &&
            result.error
              ? result.error
              : "Unknown error"
          );


        statusBox.innerText =
          "Error processing conversation.";

      }

    }

  }
);


// =====================================================
// START RECORDING
// =====================================================

startBtn.addEventListener(
  "click",
  async function() {

    try {

      console.log(
        "START BUTTON CLICKED"
      );


      // =============================================
      // CHECK BRIDGE
      // =============================================

      if (!bridgeReady) {

        statusBox.innerText =
          "Connecting to server... Please wait.";

        return;

      }


      // =============================================
      // STUDENT DETAILS
      // =============================================

      const studentName =
        document
          .getElementById("studentName")
          .value
          .trim();


      const grade =
        document
          .getElementById("grade")
          .value
          .trim();


      if (!studentName) {

        alert(
          "Please enter Student Name."
        );

        return;

      }


      if (!grade) {

        alert(
          "Please enter Grade."
        );

        return;

      }


      // =============================================
      // RESET
      // =============================================

      audioChunks = [];

      audioBlob = null;


      // =============================================
      // MICROPHONE
      // =============================================

      const stream =
        await navigator.mediaDevices
          .getUserMedia({
            audio: true
          });


      console.log(
        "Microphone permission granted."
      );


      // =============================================
      // RECORDER OPTIONS
      // =============================================

      let options = {};


      if (
        MediaRecorder.isTypeSupported(
          "audio/webm;codecs=opus"
        )
      ) {

        options.mimeType =
          "audio/webm;codecs=opus";

      }

      else if (
        MediaRecorder.isTypeSupported(
          "audio/webm"
        )
      ) {

        options.mimeType =
          "audio/webm";

      }


      // =============================================
      // MEDIA RECORDER
      // =============================================

      mediaRecorder =
        new MediaRecorder(
          stream,
          options
        );


      console.log(
        "Recorder MIME:",
        mediaRecorder.mimeType
      );


      // =============================================
      // AUDIO CHUNKS
      // =============================================

      mediaRecorder.ondataavailable =
        function(event) {

          console.log(
            "DATA AVAILABLE:",
            event.data.size
          );


          if (
            event.data &&
            event.data.size > 0
          ) {

            audioChunks.push(
              event.data
            );

          }

        };


      // =============================================
      // STOP
      // =============================================

      mediaRecorder.onstop =
        async function() {

          console.log(
            "RECORDER STOPPED"
          );


          audioBlob =
            new Blob(
              audioChunks,
              {
                type:
                  mediaRecorder.mimeType ||
                  "audio/webm"
              }
            );


          console.log(
            "FINAL AUDIO SIZE:",
            audioBlob.size
          );


          console.log(
            "FINAL AUDIO TYPE:",
            audioBlob.type
          );


          stream
            .getTracks()
            .forEach(
              function(track) {

                track.stop();

              }
            );


          if (
            !audioBlob ||
            audioBlob.size === 0
          ) {

            statusBox.innerText =
              "❌ Audio recording is empty.";

            conversationBox.innerText =
              "No audio was captured.";

            return;

          }


          // =========================================
          // ENABLE DOWNLOAD
          // =========================================

          downloadBtn.disabled =
            false;


          downloadBtn.onclick =
            function() {

              const safeName =
                document
                  .getElementById(
                    "studentName"
                  )
                  .value
                  .trim()
                  .replace(
                    /[^a-zA-Z0-9_-]/g,
                    "_"
                  );


              const safeGrade =
                document
                  .getElementById(
                    "grade"
                  )
                  .value
                  .trim()
                  .replace(
                    /[^a-zA-Z0-9_-]/g,
                    "_"
                  );


              const url =
                URL.createObjectURL(
                  audioBlob
                );


              const link =
                document.createElement(
                  "a"
                );


              link.href =
                url;


              link.download =
                safeName +
                "_" +
                safeGrade +
                "_Conversation.webm";


              document.body.appendChild(
                link
              );


              link.click();


              link.remove();


              setTimeout(
                function() {

                  URL.revokeObjectURL(
                    url
                  );

                },
                1000
              );

            };


          // =========================================
          // SEND AUDIO TO BRIDGE
          // =========================================

          await sendAudioToBridge(
            audioBlob
          );

        };


      // =============================================
      // START
      // =============================================

      mediaRecorder.start(
        1000
      );


      console.log(
        "RECORDING STARTED"
      );


      statusBox.innerText =
        "🎙️ Recording...";


      conversationBox.innerText =
        "Recording conversation...";


      startBtn.disabled =
        true;


      stopBtn.disabled =
        false;

    }


    catch(error) {

      console.error(
        "START ERROR:",
        error
      );


      statusBox.innerText =
        "❌ " +
        (
          error.message ||
          error
        );

    }

  }
);


// =====================================================
// STOP RECORDING
// =====================================================

stopBtn.addEventListener(
  "click",
  function() {

    console.log(
      "STOP BUTTON CLICKED"
    );


    if (
      mediaRecorder &&
      mediaRecorder.state !==
      "inactive"
    ) {

      mediaRecorder.stop();

    }


    stopBtn.disabled =
      true;


    startBtn.disabled =
      false;


    statusBox.innerText =
      "Preparing audio...";

  }
);


// =====================================================
// SEND AUDIO TO BRIDGE
// =====================================================

async function sendAudioToBridge(
  blob
) {

  console.log(
    "Preparing audio for bridge..."
  );


  if (!blob) {

    console.error(
      "Blob is missing."
    );

    return;

  }


  if (blob.size === 0) {

    console.error(
      "Blob size is zero."
    );

    return;

  }


  return new Promise(
    function(resolve, reject) {

      const reader =
        new FileReader();


      reader.onload =
        function() {

          try {

            const dataUrl =
              reader.result;


            console.log(
              "DATA URL LENGTH:",
              dataUrl.length
            );


            if (
              !dataUrl ||
              typeof dataUrl !==
              "string"
            ) {

              throw new Error(
                "Audio conversion failed."
              );

            }


            const commaIndex =
              dataUrl.indexOf(",");


            if (
              commaIndex === -1
            ) {

              throw new Error(
                "Invalid audio data."
              );

            }


            const base64 =
              dataUrl.substring(
                commaIndex + 1
              );


            console.log(
              "BASE64 LENGTH:",
              base64.length
            );


            if (!base64) {

              throw new Error(
                "Base64 audio is empty."
              );

            }


            // =======================================
            // STUDENT DETAILS
            // =======================================

            const studentName =
              document
                .getElementById(
                  "studentName"
                )
                .value
                .trim();


            const grade =
              document
                .getElementById(
                  "grade"
                )
                .value
                .trim();


            const date =
              document
                .getElementById(
                  "date"
                )
                .value;


            // =======================================
            // IMPORTANT MESSAGE
            //
            // SEND COMPLETE DATA URL
            // =======================================

            const message = {

              type:
                "PROCESS_AUDIO",

              audioDataUrl:
                dataUrl,

              mimeType:
                blob.type ||
                "audio/webm",

              studentName:
                studentName,

              grade:
                grade,

              date:
                date

            };


            console.log(
              "SENDING AUDIO TO BRIDGE"
            );


            console.log(
              "Data URL characters:",
              dataUrl.length
            );


            console.log(
              "Base64 characters:",
              base64.length
            );


            // =======================================
            // SEND
            // =======================================

            bridge.contentWindow.postMessage(
              message,
              "*"
            );


            statusBox.innerText =
              "Sending audio for transcription...";


            resolve();

          }


          catch(error) {

            console.error(
              "SEND ERROR:",
              error
            );


            statusBox.innerText =
              "❌ " +
              error.message;


            reject(error);

          }

        };


      reader.onerror =
        function(error) {

          console.error(
            "FILEREADER ERROR:",
            error
          );


          reject(error);

        };


      reader.readAsDataURL(
        blob
      );

    }
  );

}

</script>

</body>

</html>
