<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>BOMIS Conversation</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;

    .container {

    h1 {
      text-align: center;

      text-align: center;

</head>


<body>


<div class="container">

  <h1>BOMIS Conversation</h1>

  <div class="subtitle">
    Student Conversation Recorder
  </div>


  <!-- STUDENT NAME -->

  <label for="studentName">
    Student Name
  </label>

  <input
    type="text"
    id="studentName"
    placeholder="Enter student name"
  >


  <!-- GRADE -->

  <label for="grade">
    Grade
  </label>

  <input
    type="text"
    id="grade"
    placeholder="Enter grade"
  >


  <!-- DATE -->

  <label for="date">
    Date
  </label>

  <input
    type="date"
    id="date"
  >


  <!-- BUTTONS -->

  <div class="buttons">

    <button
      id="startBtn"
      onclick="startRecording()"
    >
      🎙 Start Recording
    </button>


    <button
      id="stopBtn"
      onclick="stopRecording()"
      disabled
    >
      ⏹ Stop Recording
    </button>


    <button
      id="downloadBtn"
      onclick="downloadAudio()"
      disabled
    >
      ⬇ Download Audio
    </button>

  </div>


  <!-- STATUS -->

  <div id="statusBox">
    Connecting to server...
  </div>


  <!-- CONVERSATION -->

  <div class="conversation-title">
    Conversation
  </div>

  <div id="conversationBox">
    Your conversation will appear here after recording.
  </div>


  <div class="info">

    Speak normally with the student.
    The system will attempt to identify different speakers
    as Person 1, Person 2, etc.

  </div>

</div>


<!-- =====================================================
     HIDDEN APPS SCRIPT BRIDGE
===================================================== -->

<iframe
  id="bridgeFrame"
  src="https://script.google.com/macros/s/AKfycby4QSe_GgfQINvLb_T5Z6BtzoMNa6Qc14vlKSU6XTrfvM2iH1vBE-ugxnW1DAJzgnZ2eg/exec"
  allow="microphone">
</iframe>


<script>


/* =========================================================
   VARIABLES
========================================================= */

let mediaRecorder = null;

let audioChunks = [];

let audioBlob = null;

let audioMimeType = "audio/webm";

let bridgeReady = false;

let recording = false;


/* =========================================================
   ELEMENTS
========================================================= */

const startBtn =
  document.getElementById("startBtn");

const stopBtn =
  document.getElementById("stopBtn");

const downloadBtn =
  document.getElementById("downloadBtn");

const statusBox =
  document.getElementById("statusBox");

const conversationBox =
  document.getElementById("conversationBox");

const bridgeFrame =
  document.getElementById("bridgeFrame");


/* =========================================================
   SET TODAY'S DATE
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    const dateInput =
      document.getElementById("date");

    if (!dateInput.value) {

      const today =
        new Date();

      const year =
        today.getFullYear();

      const month =
        String(
          today.getMonth() + 1
        ).padStart(2, "0");

      const day =
        String(
          today.getDate()
        ).padStart(2, "0");

      dateInput.value =
        year + "-" +
        month + "-" +
        day;

    }

  }
);


/* =========================================================
   RECEIVE MESSAGES FROM APPS SCRIPT BRIDGE
========================================================= */

window.addEventListener(
  "message",
  function(event) {

    const data =
      event.data;


    if (!data) {
      return;
    }


    /* -----------------------------------------------------
       BRIDGE READY
    ----------------------------------------------------- */

    if (
      data.type ===
      "BOMIS_BRIDGE_READY"
    ) {

      bridgeReady = true;

      statusBox.innerText =
        "Connected. Ready to record.";

      statusBox.style.background =
        "#e8f5e9";

      startBtn.disabled = false;

      console.log(
        "BOMIS Bridge connected."
      );

      return;
    }


    /* -----------------------------------------------------
       PROCESSING
    ----------------------------------------------------- */

    if (
      data.type ===
      "BOMIS_PROCESSING"
    ) {

      statusBox.innerText =
        "Processing conversation... Please wait.";

      statusBox.style.background =
        "#fff3cd";

      startBtn.disabled = true;

      stopBtn.disabled = true;

      return;
    }


    /* -----------------------------------------------------
       RESULT
    ----------------------------------------------------- */

    if (
      data.type ===
      "BOMIS_RESULT"
    ) {

      const result =
        data.result;


      console.log(
        "BOMIS result:",
        result
      );


      if (
        result &&
        result.success
      ) {

        conversationBox.innerText =
          result.transcript ||
          "No conversation detected.";


        statusBox.innerText =
          "Conversation saved successfully.";

        statusBox.style.background =
          "#d1e7dd";

        startBtn.disabled = false;

      }

      else {

        const errorMessage =
          result &&
          result.error
            ? result.error
            : "Unknown error occurred.";


        conversationBox.innerText =
          "Error:\n\n" +
          errorMessage;


        statusBox.innerText =
          "Error while processing conversation.";

        statusBox.style.background =
          "#f8d7da";

        startBtn.disabled = false;

      }

      return;
    }

  }
);


/* =========================================================
   PING THE BRIDGE
========================================================= */

setInterval(
  function() {

    if (
      bridgeFrame &&
      bridgeFrame.contentWindow
    ) {

      bridgeFrame.contentWindow.postMessage(
        {
          type: "BOMIS_PING"
        },
        "*"
      );

    }

  },
  1000
);


/* =========================================================
   START RECORDING
========================================================= */

async function startRecording() {


  /* -------------------------------------------------------
     CHECK BRIDGE
  ------------------------------------------------------- */

  if (!bridgeReady) {

    statusBox.innerText =
      "Connecting to server... Please wait.";

    return;

  }


  /* -------------------------------------------------------
     CHECK STUDENT NAME
  ------------------------------------------------------- */

  const studentName =
    document
      .getElementById("studentName")
      .value
      .trim();


  if (!studentName) {

    alert(
      "Please enter the student name."
    );

    return;

  }


  /* -------------------------------------------------------
     CHECK GRADE
  ------------------------------------------------------- */

  const grade =
    document
      .getElementById("grade")
      .value
      .trim();


  if (!grade) {

    alert(
      "Please enter the grade."
    );

    return;

  }


  /* -------------------------------------------------------
     GET MICROPHONE
  ------------------------------------------------------- */

  try {

    const stream =
      await navigator
        .mediaDevices
        .getUserMedia({
          audio: true
        });


    /* -----------------------------------------------------
       FIND SUPPORTED AUDIO FORMAT
    ----------------------------------------------------- */

    let options = {};

    const possibleTypes = [

      "audio/webm;codecs=opus",

      "audio/webm",

      "audio/ogg;codecs=opus",

      "audio/mp4"

    ];


    for (
      let i = 0;
      i < possibleTypes.length;
      i++
    ) {

      if (
        MediaRecorder.isTypeSupported(
          possibleTypes[i]
        )
      ) {

        options.mimeType =
          possibleTypes[i];

        break;

      }

    }


    /* -----------------------------------------------------
       CREATE RECORDER
    ----------------------------------------------------- */

    try {

      mediaRecorder =
        new MediaRecorder(
          stream,
          options
        );

    }

    catch(error) {

      mediaRecorder =
        new MediaRecorder(
          stream
        );

    }


    audioMimeType =
      mediaRecorder.mimeType ||
      options.mimeType ||
      "audio/webm";


    audioChunks = [];

    audioBlob = null;


    /* -----------------------------------------------------
       WHEN DATA ARRIVES
    ----------------------------------------------------- */

    mediaRecorder.ondataavailable =
      function(event) {

        if (
          event.data &&
          event.data.size > 0
        ) {

          audioChunks.push(
            event.data
          );

        }

      };


    /* -----------------------------------------------------
       WHEN RECORDING STOPS
    ----------------------------------------------------- */

    mediaRecorder.onstop =
      async function() {

        try {

          audioBlob =
            new Blob(
              audioChunks,
              {
                type:
                  audioMimeType
              }
            );


          console.log(
            "Audio blob size:",
            audioBlob.size
          );


          downloadBtn.disabled =
            false;


          statusBox.innerText =
            "Preparing audio for transcription...";


          /* ------------------------------------------------
             STOP MICROPHONE
          ------------------------------------------------ */

          stream
            .getTracks()
            .forEach(
              function(track) {
                track.stop();
              }
            );


          /* ------------------------------------------------
             CONVERT AUDIO TO DATA URL
          ------------------------------------------------ */

          const reader =
            new FileReader();


          reader.onloadend =
            function() {

              const dataUrl =
                reader.result;


              console.log(
                "Data URL created."
              );


              console.log(
                "Data URL length:",
                dataUrl
                  ? dataUrl.length
                  : 0
              );


              if (!dataUrl) {

                statusBox.innerText =
                  "Unable to prepare audio.";

                return;

              }


              /* --------------------------------------------
                 GET FORM VALUES
              -------------------------------------------- */

              const studentName =
                document
                  .getElementById("studentName")
                  .value
                  .trim();


              const grade =
                document
                  .getElementById("grade")
                  .value
                  .trim();


              const date =
                document
                  .getElementById("date")
                  .value;


              /* --------------------------------------------
                 SEND AUDIO TO BRIDGE
              -------------------------------------------- */

              if (
                !bridgeFrame.contentWindow
              ) {

                statusBox.innerText =
                  "Bridge is unavailable.";

                return;

              }


              statusBox.innerText =
                "Sending audio for transcription...";


              bridgeFrame
                .contentWindow
                .postMessage(

                  {

                    type:
                      "PROCESS_AUDIO",

                    audioDataUrl:
                      dataUrl,

                    mimeType:
                      audioMimeType,

                    studentName:
                      studentName,

                    grade:
                      grade,

                    date:
                      date

                  },

                  "*"

                );

            };


          reader.onerror =
            function(error) {

              console.error(
                "FileReader error:",
                error
              );

              statusBox.innerText =
                "Unable to convert audio.";

            };


          reader.readAsDataURL(
            audioBlob
          );

        }

        catch(error) {

          console.error(
            "Stop processing error:",
            error
          );

          statusBox.innerText =
            "Error preparing recording: " +
            error.message;

        }

      };


    /* -----------------------------------------------------
       START
    ----------------------------------------------------- */

    mediaRecorder.start(
      1000
    );


    recording = true;


    startBtn.disabled =
      true;

    stopBtn.disabled =
      false;

    downloadBtn.disabled =
      true;


    statusBox.innerText =
      "Recording... Speak with the student.";

    statusBox.style.background =
      "#f8d7da";


    conversationBox.innerText =
      "Recording conversation...";


  }

  catch(error) {

    console.error(
      "Microphone error:",
      error
    );


    statusBox.innerText =
      "Microphone error: " +
      error.message;


    statusBox.style.background =
      "#f8d7da";


    alert(
      "Microphone access is required. Please allow microphone permission in Chrome and try again."
    );

  }

}


/* =========================================================
   STOP RECORDING
========================================================= */

function stopRecording() {


  if (
    mediaRecorder &&
    mediaRecorder.state !== "inactive"
  ) {

    mediaRecorder.stop();

    recording = false;


    startBtn.disabled =
      true;

    stopBtn.disabled =
      true;


    statusBox.innerText =
      "Recording stopped. Processing...";


    statusBox.style.background =
      "#fff3cd";

  }

}


/* =========================================================
   DOWNLOAD AUDIO
========================================================= */

function downloadAudio() {


  if (!audioBlob) {

    alert(
      "No recording is available."
    );

    return;

  }


  const studentName =
    document
      .getElementById("studentName")
      .value
      .trim() ||
    "Student";


  const grade =
    document
      .getElementById("grade")
      .value
      .trim() ||
    "Grade";


  /* -------------------------------------------------------
     CLEAN FILE NAME
  ------------------------------------------------------- */

  const cleanStudentName =
    studentName.replace(
      /[^a-zA-Z0-9_-]/g,
      "_"
    );


  const cleanGrade =
    grade.replace(
      /[^a-zA-Z0-9_-]/g,
      "_"
    );


  const extension =
    audioMimeType.includes("ogg")
      ? "ogg"
      : audioMimeType.includes("mp4")
        ? "mp4"
        : "webm";


  const fileName =
    cleanStudentName +
    "_" +
    cleanGrade +
    "_Conversation." +
    extension;


  const audioUrl =
    URL.createObjectURL(
      audioBlob
    );


  const link =
    document.createElement("a");


  link.href =
    audioUrl;

  link.download =
    fileName;


  document
    .body
    .appendChild(link);


  link.click();


  link.remove();


  setTimeout(
    function() {

      URL.revokeObjectURL(
        audioUrl
      );

    },
    1000
  );

}


/* =========================================================
   INITIAL STATE
========================================================= */

startBtn.disabled = true;

stopBtn.disabled = true;

downloadBtn.disabled = true;


statusBox.innerText =
  "Connecting to server...";


console.log(
  "BOMIS Conversation GitHub app loaded."
);

</script>


</body>
</html>
