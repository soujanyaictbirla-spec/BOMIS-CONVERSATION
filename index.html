<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>BOMIS Conversation</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 30px;
    }

    .container {
      max-width: 850px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.10);
    }

    h1 {
      text-align: center;
      color: #333;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      padding: 12px 20px;
      margin: 20px 5px 10px 0;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    #startBtn {
      background: #198754;
      color: white;
    }

    #stopBtn {
      background: #dc3545;
      color: white;
    }

    #downloadBtn {
      background: #0d6efd;
      color: white;
    }

    button:disabled {
      background: #aaa !important;
      cursor: not-allowed;
    }

    #status {
      margin-top: 15px;
      padding: 12px;
      background: #eef2f7;
      border-radius: 8px;
      font-weight: bold;
    }

    .conversation-title {
      margin-top: 25px;
      font-size: 20px;
      font-weight: bold;
    }

    #conversationBox {
      margin-top: 10px;
      min-height: 180px;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: #fafafa;
      white-space: pre-wrap;
      line-height: 1.6;
      font-size: 16px;
      overflow-y: auto;
    }

    #bridgeFrame {
      width: 1px;
      height: 1px;
      border: 0;
      position: absolute;
      left: -10000px;
      top: -10000px;
    }

  </style>

</head>

<body>

<div class="container">

  <h1>BOMIS Conversation</h1>


  <label>Student Name</label>

  <input
    type="text"
    id="studentName"
    placeholder="Enter student name"
  >


  <label>Grade</label>

  <select id="grade">

    <option value="">
      Select Grade
    </option>

    <option value="Grade 1">Grade 1</option>
    <option value="Grade 2">Grade 2</option>
    <option value="Grade 3">Grade 3</option>
    <option value="Grade 4">Grade 4</option>
    <option value="Grade 5">Grade 5</option>
    <option value="Grade 6">Grade 6</option>
    <option value="Grade 7">Grade 7</option>
    <option value="Grade 8">Grade 8</option>
    <option value="Grade 9">Grade 9</option>
    <option value="Grade 10">Grade 10</option>
    <option value="Grade 11">Grade 11</option>
    <option value="Grade 12">Grade 12</option>

  </select>


  <label>Date</label>

  <input
    type="date"
    id="date"
  >


  <button
    id="startBtn"
    onclick="startRecording()"
  >
    🎤 Start Conversation
  </button>


  <button
    id="stopBtn"
    onclick="stopRecording()"
    disabled
  >
    ⏹ Stop Conversation
  </button>


  <button
    id="downloadBtn"
    onclick="downloadAudio()"
    disabled
  >
    ⬇ Download Audio
  </button>


  <div id="status">
    Ready
  </div>


  <div class="conversation-title">
    Conversation
  </div>


  <div id="conversationBox">

    Conversation will appear here after recording.

  </div>

</div>


<!-- =====================================================
     APPS SCRIPT BRIDGE
===================================================== -->

<iframe
  id="bridgeFrame"
  src="https://script.google.com/macros/s/AKfycby4QSe_GgfQINvLb_T5Z6BtzoMNa6Qc14vlKSU6XTrfvM2iH1vBE-ugxnW1DAJzgnZ2eg/exec"
  allow="microphone">
</iframe>


<script>


let mediaRecorder = null;

let audioChunks = [];

let audioBlob = null;

let bridgeReady = false;


/* =====================================================
   DATE
===================================================== */

document.getElementById("date").value =
  new Date()
    .toISOString()
    .split("T")[0];


/* =====================================================
   RECEIVE MESSAGES FROM BRIDGE
===================================================== */

window.addEventListener(
  "message",
  function(event) {

    const data = event.data;

    if (!data) {
      return;
    }


    console.log(
      "Message from bridge:",
      data
    );


    /* -----------------------------------------------
       BRIDGE READY
    ------------------------------------------------ */

    if (
      data.type ===
      "BOMIS_BRIDGE_READY"
    ) {

      bridgeReady = true;

      document.getElementById(
        "status"
      ).innerText =
        "Connected to BOMIS server.";

      return;
    }


    /* -----------------------------------------------
       PROCESSING
    ------------------------------------------------ */

    if (
      data.type ===
      "BOMIS_PROCESSING"
    ) {

      document.getElementById(
        "status"
      ).innerText =
        "⏳ Sending audio to Deepgram...";

      return;
    }


    /* -----------------------------------------------
       RESULT
    ------------------------------------------------ */

    if (
      data.type ===
      "BOMIS_RESULT"
    ) {

      console.log(
        "Final result:",
        data.result
      );


      if (
        data.result &&
        data.result.success
      ) {

        const transcript =
          data.result.transcript || "";


        document.getElementById(
          "conversationBox"
        ).innerText =
          transcript ||
          "No conversation text detected.";


        document.getElementById(
          "status"
        ).innerText =
          "✅ Conversation saved successfully.";

      }

      else {

        const error =
          data.result &&
          data.result.error
            ? data.result.error
            : "Unknown error";


        document.getElementById(
          "conversationBox"
        ).innerText =
          "❌ ERROR\n\n" +
          error;


        document.getElementById(
          "status"
        ).innerText =
          "❌ Processing failed.";

      }

    }

  }
);


/* =====================================================
   START RECORDING
===================================================== */

async function startRecording() {

  try {


    const studentName =
      document
        .getElementById(
          "studentName"
        )
        .value
        .trim();


    const grade =
      document
        .getElementById(
          "grade"
        )
        .value;


    if (!studentName) {

      alert(
        "Please enter Student Name."
      );

      return;

    }


    if (!grade) {

      alert(
        "Please select Grade."
      );

      return;

    }


    /* -----------------------------------------------
       MICROPHONE
    ------------------------------------------------ */

    const stream =
      await navigator
        .mediaDevices
        .getUserMedia({
          audio: true
        });


    audioChunks = [];

    audioBlob = null;


    /* -----------------------------------------------
       CHOOSE RECORDING FORMAT
    ------------------------------------------------ */

    let options = {};


    if (
      MediaRecorder.isTypeSupported(
        "audio/webm;codecs=opus"
      )
    ) {

      options.mimeType =
        "audio/webm;codecs=opus";

    }


    mediaRecorder =
      new MediaRecorder(
        stream,
        options
      );


    console.log(
      "Recorder MIME type:",
      mediaRecorder.mimeType
    );


    /* -----------------------------------------------
       COLLECT AUDIO
    ------------------------------------------------ */

    mediaRecorder.ondataavailable =
      function(event) {

        console.log(
          "Audio chunk:",
          event.data.size
        );


        if (
          event.data &&
          event.data.size > 0
        ) {

          audioChunks.push(
            event.data
          );

        }

      };


    /* -----------------------------------------------
       RECORDING STOPPED
    ------------------------------------------------ */

    mediaRecorder.onstop =
      function() {

        console.log(
          "Recorder stopped."
        );


        audioBlob =
          new Blob(
            audioChunks,
            {
              type:
                mediaRecorder.mimeType ||
                "audio/webm"
            }
          );


        console.log(
          "FINAL AUDIO SIZE:",
          audioBlob.size
        );


        console.log(
          "FINAL AUDIO TYPE:",
          audioBlob.type
        );


        /* -----------------------------------------
           Stop microphone
        ------------------------------------------ */

        stream
          .getTracks()
          .forEach(
            function(track) {
              track.stop();
            }
          );


        document
          .getElementById(
            "downloadBtn"
          )
          .disabled = false;


        /* -----------------------------------------
           Send after Blob is ready
        ------------------------------------------ */

        if (
          audioBlob.size === 0
        ) {

          document
            .getElementById(
              "status"
            )
            .innerText =
              "❌ Audio recording is empty.";

          return;

        }


        sendAudioToServer();

      };


    /* -----------------------------------------------
       Start recording
    ------------------------------------------------ */

    mediaRecorder.start(
      1000
    );


    document
      .getElementById(
        "startBtn"
      )
      .disabled = true;


    document
      .getElementById(
        "stopBtn"
      )
      .disabled = false;


    document
      .getElementById(
        "downloadBtn"
      )
      .disabled = true;


    document
      .getElementById(
        "status"
      )
      .innerText =
        "🎤 Recording conversation...";


    document
      .getElementById(
        "conversationBox"
      )
      .innerText =
        "Recording in progress...";


  }

  catch(error) {


    console.error(
      error
    );


    document
      .getElementById(
        "status"
      )
      .innerText =
        "❌ Microphone error: " +
        error.message;

  }

}


/* =====================================================
   STOP RECORDING
===================================================== */

function stopRecording() {


  if (
    mediaRecorder &&
    mediaRecorder.state !==
      "inactive"
  ) {

    document
      .getElementById(
        "status"
      )
      .innerText =
        "⏳ Finishing recording...";


    mediaRecorder.stop();

  }

}


/* =====================================================
   SEND AUDIO TO APPS SCRIPT
===================================================== */

function sendAudioToServer() {


  if (
    !audioBlob ||
    audioBlob.size === 0
  ) {

    document
      .getElementById(
        "status"
      )
      .innerText =
        "❌ No audio was recorded.";

    return;

  }


  console.log(
    "Sending audio.",
    audioBlob.size,
    audioBlob.type
  );


  document
    .getElementById(
      "status"
    )
    .innerText =
      "⏳ Preparing audio...";


  document
    .getElementById(
      "conversationBox"
    )
    .innerText =
      "⏳ Please wait...\n\nTranscribing conversation...";


  const reader =
    new FileReader();


  reader.onload =
    function() {


      try {


        const result =
          reader.result;


        if (
          !result
        ) {

          throw new Error(
            "Could not read audio."
          );

        }


        const parts =
          result.split(",");


        if (
          parts.length < 2
        ) {

          throw new Error(
            "Invalid audio data."
          );

        }


        const base64 =
          parts[1];


        console.log(
          "Base64 length:",
          base64.length
        );


        if (
          !base64 ||
          base64.length < 100
        ) {

          throw new Error(
            "Audio converted to empty Base64."
          );

        }


        const message = {

          type:
            "PROCESS_AUDIO",

          base64:
            base64,

          mimeType:
            audioBlob.type ||
            "audio/webm",

          studentName:
            document
              .getElementById(
                "studentName"
              )
              .value
              .trim(),

          grade:
            document
              .getElementById(
                "grade"
              )
              .value,

          date:
            document
              .getElementById(
                "date"
              )
              .value

        };


        console.log(
          "Sending PROCESS_AUDIO message."
        );


        const bridge =
          document
            .getElementById(
              "bridgeFrame"
            );


        if (
          !bridge ||
          !bridge.contentWindow
        ) {

          throw new Error(
            "BOMIS bridge is not available."
          );

        }


        bridge.contentWindow.postMessage(
          message,
          "*"
        );


      }

      catch(error) {


        console.error(
          error
        );


        document
          .getElementById(
            "status"
          )
          .innerText =
            "❌ " +
            error.message;

      }

    };


  reader.onerror =
    function() {

      document
        .getElementById(
          "status"
        )
        .innerText =
          "❌ Could not read audio file.";

    };


  reader.readAsDataURL(
    audioBlob
  );

}


/* =====================================================
   DOWNLOAD AUDIO
===================================================== */

function downloadAudio() {


  if (
    !audioBlob ||
    audioBlob.size === 0
  ) {

    alert(
      "No audio available."
    );

    return;

  }


  const studentName =
    document
      .getElementById(
        "studentName"
      )
      .value
      .trim() ||
    "Student";


  const grade =
    document
      .getElementById(
        "grade"
      )
      .value ||
    "Grade";


  const filename =
    studentName
      .replace(
        /\s+/g,
        "_"
      ) +
    "_" +
    grade
      .replace(
        /\s+/g,
        "_"
      ) +
    "_Conversation.webm";


  const url =
    URL.createObjectURL(
      audioBlob
    );


  const link =
    document.createElement(
      "a"
    );


  link.href =
    url;

  link.download =
    filename;


  document.body.appendChild(
    link
  );


  link.click();


  document.body.removeChild(
    link
  );


  setTimeout(
    function() {

      URL.revokeObjectURL(
        url
      );

    },
    1000
  );

}

</script>

</body>
</html>
