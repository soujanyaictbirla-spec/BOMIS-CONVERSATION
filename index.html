<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BOMIS Conversation</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    .container {
      width: 92%;
      max-width: 900px;
      margin: 30px auto;
    }

    .header {
      background: #ffffff;
      border-radius: 16px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .header p {
      margin: 0;
      color: #666;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 22px;
    }

    button {
      border: none;
      border-radius: 9px;
      padding: 13px 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #startBtn {
      background: #16803c;
      color: white;
    }

    #stopBtn {
      background: #c62828;
      color: white;
    }

    #downloadBtn {
      background: #1565c0;
      color: white;
    }

    #clearBtn {
      background: #666;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      margin-top: 18px;
      padding: 14px;
      border-radius: 8px;
      background: #eef3f8;
      font-weight: bold;
    }

    .timer {
      text-align: center;
      font-size: 34px;
      font-weight: bold;
      margin: 20px 0;
    }

    .conversation-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    #conversationBox {
      min-height: 180px;
      background: #f8f9fa;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 18px;
      white-space: pre-wrap;
      line-height: 1.6;
      overflow-y: auto;
    }

    .recording {
      animation: pulse 1.3s infinite;
    }

    @keyframes pulse {
      0% {
        opacity: 1;
      }

      50% {
        opacity: 0.55;
      }

      100% {
        opacity: 1;
      }
    }

    .small {
      font-size: 13px;
      color: #777;
      margin-top: 8px;
    }

    #bridgeFrame {
      width: 1px;
      height: 1px;
      border: 0;
      position: absolute;
      left: -9999px;
      top: -9999px;
      visibility: hidden;
    }
  </style>

</head>

<body>

<div class="container">

  <div class="header">
    <h1>BOMIS Conversation</h1>
    <p>Student Conversation Recorder & Transcriber</p>
  </div>

  <div class="card">

```
<label for="studentName">
  Student Name
</label>

<input
  type="text"
  id="studentName"
  placeholder="Enter student name"
>

<label for="grade">
  Grade
</label>

<input
  type="text"
  id="grade"
  placeholder="Example: Grade 5"
>

<label for="date">
  Date
</label>

<input
  type="date"
  id="date"
>

<div class="buttons">

  <button id="startBtn">
    🎙️ Start Recording
  </button>

  <button id="stopBtn" disabled>
    ⏹ Stop Recording
  </button>

  <button id="downloadBtn" disabled>
    ⬇ Download Audio
  </button>

  <button id="clearBtn">
    Clear
  </button>

</div>

<div id="timer" class="timer">
  00:00
</div>

<div id="status" class="status">
  🔄 Connecting to BOMIS server...
</div>

<div class="small">
  Please allow microphone access when Chrome asks.
</div>
```

  </div>

  <div class="card">

```
<div class="conversation-title">
  📝 Conversation
</div>

<div id="conversationBox">
  Conversation will appear here after recording.
</div>
```

  </div>

</div>

<!-- =====================================================
     HIDDEN APPS SCRIPT BRIDGE
     LATEST BOMIS CONVERSATION URL
     ===================================================== -->

<iframe
  id="bridgeFrame"
  src="https://script.google.com/macros/s/AKfycbzfD-Rd2gNhV-5izmNgAoSrbOpeXeYezZXon961Ece-2RawVq7U8dnJ2W7LUGfvNbgLsA/exec"
  allow="microphone"
></iframe>

<script>

  // =====================================================
  // ELEMENTS
  // =====================================================

  const startBtn =
    document.getElementById("startBtn");

  const stopBtn =
    document.getElementById("stopBtn");

  const downloadBtn =
    document.getElementById("downloadBtn");

  const clearBtn =
    document.getElementById("clearBtn");

  const statusBox =
    document.getElementById("status");

  const conversationBox =
    document.getElementById("conversationBox");

  const timerBox =
    document.getElementById("timer");

  const studentNameInput =
    document.getElementById("studentName");

  const gradeInput =
    document.getElementById("grade");

  const dateInput =
    document.getElementById("date");

  const bridgeFrame =
    document.getElementById("bridgeFrame");


  // =====================================================
  // VARIABLES
  // =====================================================

  let mediaRecorder = null;

  let audioChunks = [];

  let audioBlob = null;

  let audioDataUrl = null;

  let bridgeReady = false;

  let recordingSeconds = 0;

  let timerInterval = null;


  // =====================================================
  // TODAY'S DATE
  // =====================================================

  const today = new Date();

  const yyyy =
    today.getFullYear();

  const mm =
    String(today.getMonth() + 1)
      .padStart(2, "0");

  const dd =
    String(today.getDate())
      .padStart(2, "0");

  dateInput.value =
    yyyy + "-" + mm + "-" + dd;


  // =====================================================
  // STATUS
  // =====================================================

  function setStatus(message) {

    statusBox.textContent = message;

  }


  // =====================================================
  // TIMER
  // =====================================================

  function resetTimer() {

    clearInterval(timerInterval);

    recordingSeconds = 0;

    timerBox.textContent = "00:00";

  }


  function startTimer() {

    clearInterval(timerInterval);

    recordingSeconds = 0;

    timerInterval =
      setInterval(function() {

        recordingSeconds++;

        const minutes =
          Math.floor(recordingSeconds / 60);

        const seconds =
          recordingSeconds % 60;

        timerBox.textContent =
          String(minutes).padStart(2, "0") +
          ":" +
          String(seconds).padStart(2, "0");

      }, 1000);

  }


  function stopTimer() {

    clearInterval(timerInterval);

  }


  // =====================================================
  // BRIDGE READY
  // =====================================================

  window.addEventListener(
    "message",
    function(event) {

      const data = event.data;

      if (!data) {
        return;
      }

      console.log(
        "Message received:",
        data.type
      );


      // -------------------------------------------------
      // BRIDGE READY
      // -------------------------------------------------

      if (
        data.type ===
        "BOMIS_BRIDGE_READY"
      ) {

        bridgeReady = true;

        setStatus(
          "🟢 Ready to record"
        );

        console.log(
          "BOMIS Bridge is ready."
        );

        return;
      }


      // -------------------------------------------------
      // PROCESSING
      // -------------------------------------------------

      if (
        data.type ===
        "BOMIS_PROCESSING"
      ) {

        setStatus(
          "🤖 Processing conversation... Please wait."
        );

        return;
      }


      // -------------------------------------------------
      // RESULT
      // -------------------------------------------------

      if (
        data.type ===
        "BOMIS_RESULT"
      ) {

        const result =
          data.result;

        console.log(
          "BOMIS RESULT:",
          result
        );


        if (
          result &&
          result.success
        ) {

          conversationBox.textContent =
            result.transcript ||
            "No conversation detected.";

          setStatus(
            "✅ Conversation saved successfully to Google Sheet."
          );

        } else {

          const errorMessage =
            result &&
            result.error
              ? result.error
              : "Unknown error occurred.";

          setStatus(
            "❌ Error: " +
            errorMessage
          );

        }


        startBtn.disabled = false;

        stopBtn.disabled = true;

        return;
      }

    }
  );


  // =====================================================
  // BRIDGE LOAD
  // =====================================================

  bridgeFrame.addEventListener(
    "load",
    function() {

      console.log(
        "BOMIS Bridge iframe loaded."
      );

      setStatus(
        "🟢 Ready to record"
      );

      bridgeReady = true;

    }
  );


  // =====================================================
  // START RECORDING
  // =====================================================

  startBtn.addEventListener(
    "click",
    async function() {

      try {

        const studentName =
          studentNameInput.value.trim();

        const grade =
          gradeInput.value.trim();


        // -----------------------------------------------
        // STUDENT NAME
        // -----------------------------------------------

        if (!studentName) {

          alert(
            "Please enter the student name."
          );

          studentNameInput.focus();

          return;
        }


        // -----------------------------------------------
        // GRADE
        // -----------------------------------------------

        if (!grade) {

          alert(
            "Please enter the grade."
          );

          gradeInput.focus();

          return;
        }


        // -----------------------------------------------
        // MICROPHONE CHECK
        // -----------------------------------------------

        if (
          !navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia
        ) {

          throw new Error(
            "Your browser does not support microphone recording."
          );

        }


        setStatus(
          "🎙️ Requesting microphone access..."
        );


        const stream =
          await navigator.mediaDevices.getUserMedia(
            {
              audio: true
            }
          );


        // -----------------------------------------------
        // RESET AUDIO
        // -----------------------------------------------

        audioChunks = [];

        audioBlob = null;

        audioDataUrl = null;


        // -----------------------------------------------
        // MEDIA RECORDER
        // -----------------------------------------------

        let options = {};

        if (
          MediaRecorder.isTypeSupported(
            "audio/webm;codecs=opus"
          )
        ) {

          options = {
            mimeType:
              "audio/webm;codecs=opus"
          };

        } else if (
          MediaRecorder.isTypeSupported(
            "audio/webm"
          )
        ) {

          options = {
            mimeType:
              "audio/webm"
          };

        }


        mediaRecorder =
          new MediaRecorder(
            stream,
            options
          );


        console.log(
          "Recorder MIME type:",
          mediaRecorder.mimeType
        );


        // -----------------------------------------------
        // AUDIO DATA
        // -----------------------------------------------

        mediaRecorder.ondataavailable =
          function(event) {

            console.log(
              "Audio chunk:",
              event.data.size
            );

            if (
              event.data &&
              event.data.size > 0
            ) {

              audioChunks.push(
                event.data
              );

            }

          };


        // -----------------------------------------------
        // RECORDING STOPPED
        // -----------------------------------------------

        mediaRecorder.onstop =
          async function() {

            console.log(
              "MediaRecorder stopped."
            );


            stream
              .getTracks()
              .forEach(function(track) {
                track.stop();
              });


            audioBlob =
              new Blob(
                audioChunks,
                {
                  type:
                    mediaRecorder.mimeType ||
                    "audio/webm"
                }
              );


            console.log(
              "Final audio size:",
              audioBlob.size
            );


            if (
              audioBlob.size === 0
            ) {

              setStatus(
                "❌ No audio was recorded."
              );

              startBtn.disabled = false;

              return;

            }


            // -------------------------------------------
            // CONVERT AUDIO TO DATA URL
            // -------------------------------------------

            setStatus(
              "⏳ Preparing audio..."
            );


            try {

              audioDataUrl =
                await blobToDataURL(
                  audioBlob
                );

            } catch (error) {

              console.error(
                "FileReader error:",
                error
              );

              setStatus(
                "❌ Could not prepare audio."
              );

              startBtn.disabled = false;

              return;

            }


            console.log(
              "Data URL length:",
              audioDataUrl.length
            );


            // -------------------------------------------
            // DOWNLOAD
            // -------------------------------------------

            downloadBtn.disabled = false;

            downloadAudio();


            // -------------------------------------------
            // SEND TO APPS SCRIPT
            // -------------------------------------------

            sendAudioToBridge();

          };


        // -----------------------------------------------
        // START MEDIA RECORDER
        // -----------------------------------------------

        mediaRecorder.start(250);


        console.log(
          "Recording started."
        );


        startBtn.disabled = true;

        stopBtn.disabled = false;

        downloadBtn.disabled = true;


        conversationBox.textContent =
          "Recording conversation...";


        startTimer();


        timerBox.classList.add(
          "recording"
        );


        setStatus(
          "🔴 Recording conversation..."
        );


      } catch (error) {

        console.error(
          "Microphone error:",
          error
        );


        setStatus(
          "❌ Microphone error: " +
          (
            error.message ||
            String(error)
          )
        );


        startBtn.disabled = false;

        stopBtn.disabled = true;

      }

    }
  );


  // =====================================================
  // STOP RECORDING
  // =====================================================

  stopBtn.addEventListener(
    "click",
    function() {

      console.log(
        "Stop button clicked."
      );


      if (
        mediaRecorder &&
        mediaRecorder.state !==
        "inactive"
      ) {

        setStatus(
          "⏳ Recording stopped. Preparing audio..."
        );


        mediaRecorder.stop();

        stopTimer();

        timerBox.classList.remove(
          "recording"
        );

        stopBtn.disabled = true;

        startBtn.disabled = true;

      }

    }
  );


  // =====================================================
  // BLOB TO DATA URL
  // =====================================================

  function blobToDataURL(blob) {

    return new Promise(
      function(resolve, reject) {

        const reader =
          new FileReader();


        reader.onload =
          function() {

            resolve(
              reader.result
            );

          };


        reader.onerror =
          function(error) {

            reject(error);

          };


        reader.readAsDataURL(blob);

      }
    );

  }


  // =====================================================
  // SEND AUDIO TO APPS SCRIPT BRIDGE
  // =====================================================

  function sendAudioToBridge() {

    if (!audioDataUrl) {

      setStatus(
        "❌ Audio data is missing."
      );

      startBtn.disabled = false;

      return;

    }


    const studentName =
      studentNameInput.value.trim();

    const grade =
      gradeInput.value.trim();

    const date =
      dateInput.value;


    console.log(
      "================================"
    );

    console.log(
      "Sending conversation to Bridge"
    );

    console.log(
      "Student:",
      studentName
    );

    console.log(
      "Grade:",
      grade
    );

    console.log(
      "Date:",
      date
    );

    console.log(
      "Audio Data URL length:",
      audioDataUrl.length
    );

    console.log(
      "Bridge ready:",
      bridgeReady
    );

    console.log(
      "================================"
    );


    setStatus(
      "⏳ Sending conversation for transcription..."
    );


    if (
      !bridgeFrame.contentWindow
    ) {

      setStatus(
        "❌ BOMIS Bridge is unavailable."
      );

      startBtn.disabled = false;

      return;

    }


    bridgeFrame.contentWindow.postMessage(
      {
        type: "PROCESS_AUDIO",

        audioDataUrl:
          audioDataUrl,

        mimeType:
          audioBlob.type ||
          "audio/webm",

        studentName:
          studentName,

        grade:
          grade,

        date:
          date

      },
      "*"
    );

  }


  // =====================================================
  // DOWNLOAD AUDIO
  // =====================================================

  function downloadAudio() {

    if (!audioBlob) {
      return;
    }


    const studentName =
      studentNameInput.value
        .trim()
        .replace(
          /[^a-zA-Z0-9-_ ]/g,
          ""
        )
        .replace(
          /\s+/g,
          "_"
        ) ||
      "Student";


    const grade =
      gradeInput.value
        .trim()
        .replace(
          /[^a-zA-Z0-9-_ ]/g,
          ""
        )
        .replace(
          /\s+/g,
          "_"
        ) ||
      "Grade";


    const fileName =
      "BOMIS_" +
      studentName +
      "_" +
      grade +
      "_Conversation.webm";


    const url =
      URL.createObjectURL(
        audioBlob
      );


    const link =
      document.createElement("a");


    link.href = url;

    link.download = fileName;


    document.body.appendChild(
      link
    );


    link.click();


    document.body.removeChild(
      link
    );


    setTimeout(
      function() {

        URL.revokeObjectURL(url);

      },
      1000
    );

  }


  // =====================================================
  // DOWNLOAD BUTTON
  // =====================================================

  downloadBtn.addEventListener(
    "click",
    function() {

      downloadAudio();

    }
  );


  // =====================================================
  // CLEAR
  // =====================================================

  clearBtn.addEventListener(
    "click",
    function() {

      if (
        mediaRecorder &&
        mediaRecorder.state !==
        "inactive"
      ) {

        mediaRecorder.stop();

      }


      stopTimer();


      studentNameInput.value = "";

      gradeInput.value = "";


      dateInput.value =
        yyyy +
        "-" +
        mm +
        "-" +
        dd;


      conversationBox.textContent =
        "Conversation will appear here after recording.";


      audioBlob = null;

      audioDataUrl = null;

      audioChunks = [];


      downloadBtn.disabled = true;

      stopBtn.disabled = true;

      startBtn.disabled = false;


      resetTimer();


      timerBox.classList.remove(
        "recording"
      );


      setStatus(
        "🟢 Ready to record"
      );

    }
  );


  // =====================================================
  // INITIAL STATUS
  // =====================================================

  setStatus(
    "🟢 Ready to record"
  );


  console.log(
    "BOMIS Conversation app loaded."
  );

</script>

</body>
</html>
