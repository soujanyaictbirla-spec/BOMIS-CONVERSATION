<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BOMIS Conversation</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 15px;
      font-family: Arial, sans-serif;
      background: #f3f6f9;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 850px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.10);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 30px;
      font-size: 30px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 18px;
    }

    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 5px;
      margin-bottom: 20px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 13px 25px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }

    #startBtn {
      background: #198754;
      color: white;
    }

    #startBtn:hover {
      background: #157347;
    }

    #stopBtn {
      background: #dc3545;
      color: white;
    }

    #stopBtn:hover {
      background: #bb2d3b;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      text-align: center;
      min-height: 25px;
      margin: 12px 0 25px;
      font-weight: bold;
    }

    .conversation-title {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    #conversationBox {
      width: 100%;
      min-height: 300px;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 18px;
      background: #fafafa;
      white-space: pre-wrap;
      overflow-y: auto;
      font-size: 16px;
      line-height: 1.6;
    }

    #downloadLink {
      display: none;
      margin-top: 18px;
      text-align: center;
    }

    #downloadLink a {
      display: inline-block;
      background: #0d6efd;
      color: white;
      text-decoration: none;
      padding: 11px 20px;
      border-radius: 8px;
      font-weight: bold;
    }

    #bridgeFrame {
      display: none;
      width: 0;
      height: 0;
      border: 0;
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px;
      }

      .buttons {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>


<body>

<div class="container">

  <h1>BOMIS Conversation</h1>


  <!-- STUDENT NAME -->

  <label for="studentName">
    Student Name
  </label>

  <input
    type="text"
    id="studentName"
    placeholder="Enter student name"
  >


  <!-- GRADE -->

  <label for="grade">
    Grade
  </label>

  <select id="grade">

    <option value="">
      Select Grade
    </option>

    <option value="Grade 1">Grade 1</option>
    <option value="Grade 2">Grade 2</option>
    <option value="Grade 3">Grade 3</option>
    <option value="Grade 4">Grade 4</option>
    <option value="Grade 5">Grade 5</option>
    <option value="Grade 6">Grade 6</option>
    <option value="Grade 7">Grade 7</option>
    <option value="Grade 8">Grade 8</option>
    <option value="Grade 9">Grade 9</option>
    <option value="Grade 10">Grade 10</option>
    <option value="Grade 11">Grade 11</option>
    <option value="Grade 12">Grade 12</option>

  </select>


  <!-- BUTTONS -->

  <div class="buttons">

    <button
      id="startBtn"
      onclick="startRecording()"
    >
      🎙 Start Recording
    </button>


    <button
      id="stopBtn"
      onclick="stopRecording()"
      disabled
    >
      ⏹ Stop
    </button>

  </div>


  <!-- STATUS -->

  <div id="status">
    Ready to record
  </div>


  <!-- CONVERSATION -->

  <div class="conversation-title">
    Conversation
  </div>

  <div id="conversationBox">
    Your conversation will appear here...
  </div>


  <!-- DOWNLOAD -->

  <div id="downloadLink"></div>

</div>


<!-- =====================================================
     HIDDEN APPS SCRIPT BRIDGE
     ===================================================== -->

<iframe
  id="bridgeFrame"
  src="https://script.google.com/macros/s/AKfycbxxWDxkNVEKMwjX_89cSM8m-Z5NxFo7DItivW4VIlzXO2MkTH4F7q88foPbawE5h4ypnA/exec">
</iframe>


<script>

/* =====================================================
   BOMIS CONVERSATION
   ===================================================== */


/*
   YOUR NEW APPS SCRIPT URL
*/

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxxWDxkNVEKMwjX_89cSM8m-Z5NxFo7DItivW4VIlzXO2MkTH4F7q88foPbawE5h4ypnA/exec";


let mediaRecorder = null;

let audioChunks = [];

let recordingStream = null;

let currentJobId = null;

let pollingTimer = null;

let pollingAttempts = 0;

let bridgeReady = false;


/* =====================================================
   PAGE LOAD
   ===================================================== */

console.log(
  "===== BOMIS GITHUB APP LOADED ====="
);


/* =====================================================
   BRIDGE MESSAGE
   ===================================================== */

window.addEventListener(
  "message",
  function(event) {

    const data =
      event.data;

    if (!data) {
      return;
    }


    console.log(
      "Message from bridge:",
      data
    );


    if (
      data.type ===
      "BOMIS_BRIDGE_READY"
    ) {

      bridgeReady = true;

      console.log(
        "BOMIS Bridge is ready."
      );

      return;
    }


    if (
      data.type ===
      "BOMIS_PROCESSING"
    ) {

      setStatus(
        "Sending conversation for transcription..."
      );

      return;
    }

  }
);


/* =====================================================
   START RECORDING
   ===================================================== */

async function startRecording() {

  const studentName =
    document
      .getElementById("studentName")
      .value
      .trim();


  const grade =
    document
      .getElementById("grade")
      .value;


  if (!studentName) {

    alert(
      "Please enter the student name."
    );

    return;
  }


  if (!grade) {

    alert(
      "Please select the grade."
    );

    return;
  }


  try {

    setStatus(
      "Requesting microphone..."
    );


    recordingStream =
      await navigator.mediaDevices.getUserMedia(
        {
          audio: true
        }
      );


    audioChunks = [];


    /*
       Use WebM/Opus where supported.
    */

    let options = {};


    if (
      MediaRecorder.isTypeSupported(
        "audio/webm;codecs=opus"
      )
    ) {

      options.mimeType =
        "audio/webm;codecs=opus";

    } else if (
      MediaRecorder.isTypeSupported(
        "audio/webm"
      )
    ) {

      options.mimeType =
        "audio/webm";
    }


    mediaRecorder =
      new MediaRecorder(
        recordingStream,
        options
      );


    mediaRecorder.ondataavailable =
      function(event) {

        if (
          event.data &&
          event.data.size > 0
        ) {

          audioChunks.push(
            event.data
          );
        }
      };


    mediaRecorder.onstop =
      function() {

        finishRecording();
      };


    mediaRecorder.start();


    document
      .getElementById("startBtn")
      .disabled = true;


    document
      .getElementById("stopBtn")
      .disabled = false;


    setStatus(
      "🔴 Recording..."
    );


    console.log(
      "Recording started."
    );

  } catch (error) {

    console.error(
      "Microphone error:",
      error
    );


    setStatus(
      "Microphone access failed."
    );


    alert(
      "Please allow microphone access in Chrome."
    );
  }
}


/* =====================================================
   STOP RECORDING
   ===================================================== */

function stopRecording() {

  if (
    !mediaRecorder ||
    mediaRecorder.state ===
      "inactive"
  ) {

    return;
  }


  console.log(
    "Stopping recording..."
  );


  mediaRecorder.stop();


  if (recordingStream) {

    recordingStream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();
        }
      );
  }


  document
    .getElementById("startBtn")
    .disabled = false;


  document
    .getElementById("stopBtn")
    .disabled = true;


  setStatus(
    "Preparing recording..."
  );
}


/* =====================================================
   FINISH RECORDING
   ===================================================== */

function finishRecording() {

  console.log(
    "Recording stopped."
  );


  if (
    audioChunks.length === 0
  ) {

    setStatus(
      "No audio was recorded."
    );

    return;
  }


  const mimeType =
    (
      mediaRecorder &&
      mediaRecorder.mimeType
    ) ||
    "audio/webm";


  const audioBlob =
    new Blob(
      audioChunks,
      {
        type: mimeType
      }
    );


  console.log(
    "Audio size:",
    audioBlob.size
  );


  /*
     DOWNLOAD AUDIO LOCALLY
  */

  createDownloadLink(
    audioBlob
  );


  /*
     CONVERT AUDIO TO BASE64
  */

  const reader =
    new FileReader();


  reader.onloadend =
    function() {

      const dataUrl =
        reader.result;


      console.log(
        "Data URL created."
      );


      console.log(
        "Data URL length:",
        dataUrl.length
      );


      sendAudioToBridge(
        dataUrl,
        mimeType
      );
    };


  reader.onerror =
    function(error) {

      console.error(
        "FileReader error:",
        error
      );


      setStatus(
        "Could not read recording."
      );
    };


  reader.readAsDataURL(
    audioBlob
  );
}


/* =====================================================
   CREATE DOWNLOAD LINK
   ===================================================== */

function createDownloadLink(
  audioBlob
) {

  const studentName =
    document
      .getElementById("studentName")
      .value
      .trim();


  const grade =
    document
      .getElementById("grade")
      .value;


  let safeName =
    studentName
      .replace(
        /[^a-z0-9]/gi,
        "_"
      );


  let safeGrade =
    grade
      .replace(
        /[^a-z0-9]/gi,
        "_"
      );


  const fileName =
    "BOMIS_" +
    safeName +
    "_" +
    safeGrade +
    "_Conversation.webm";


  const audioUrl =
    URL.createObjectURL(
      audioBlob
    );


  const container =
    document.getElementById(
      "downloadLink"
    );


  container.innerHTML =
    "";


  const link =
    document.createElement(
      "a"
    );


  link.href =
    audioUrl;


  link.download =
    fileName;


  link.textContent =
    "⬇ Download Recording";


  container.appendChild(
    link
  );


  container.style.display =
    "block";
}


/* =====================================================
   SEND AUDIO TO BRIDGE
   ===================================================== */

function sendAudioToBridge(
  dataUrl,
  mimeType
) {

  console.log(
    "Sending audio to Bridge..."
  );


  const studentName =
    document
      .getElementById("studentName")
      .value
      .trim();


  const grade =
    document
      .getElementById("grade")
      .value;


  const today =
    new Date();


  const date =
    today.toLocaleDateString(
      "en-IN"
    );


  /*
     CREATE UNIQUE JOB
  */

  currentJobId =
    "JOB_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2, 8);


  console.log(
    "Job ID:",
    currentJobId
  );


  console.log(
    "Student:",
    studentName
  );


  console.log(
    "Grade:",
    grade
  );


  console.log(
    "Audio length:",
    dataUrl.length
  );


  setStatus(
    "Sending conversation for transcription..."
  );


  const bridgeFrame =
    document.getElementById(
      "bridgeFrame"
    );


  if (
    !bridgeFrame ||
    !bridgeFrame.contentWindow
  ) {

    setStatus(
      "Bridge is not available."
    );

    return;
  }


  /*
     SEND COMPLETE DATA URL
  */

  bridgeFrame.contentWindow.postMessage(

    {
      type:
        "PROCESS_AUDIO",

      audioDataUrl:
        dataUrl,

      mimeType:
        mimeType,

      studentName:
        studentName,

      grade:
        grade,

      date:
        date,

      jobId:
        currentJobId
    },

    "*"
  );


  /*
     START POLLING
     IMMEDIATELY
  */

  startResultPolling(
    currentJobId
  );
}


/* =====================================================
   START RESULT POLLING
   ===================================================== */

function startResultPolling(
  jobId
) {

  currentJobId =
    jobId;


  pollingAttempts =
    0;


  if (pollingTimer) {

    clearInterval(
      pollingTimer
    );

    pollingTimer =
      null;
  }


  console.log(
    "Starting polling:",
    jobId
  );


  checkTranscript(
    jobId
  );


  pollingTimer =
    setInterval(
      function() {

        pollingAttempts++;


        console.log(
          "Checking transcript...",
          pollingAttempts,
          jobId
        );


        if (
          pollingAttempts >= 90
        ) {

          clearInterval(
            pollingTimer
          );

          pollingTimer =
            null;


          setStatus(
            "Transcription timed out. Please try again."
          );


          return;
        }


        checkTranscript(
          jobId
        );

      },
      2000
    );
}


/* =====================================================
   CHECK TRANSCRIPT
   ===================================================== */

function checkTranscript(
  jobId
) {

  const callbackName =
    "bomIsCallback_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() * 100000
    );


  let finished =
    false;


  const script =
    document.createElement(
      "script"
    );


  script.id =
    callbackName;


  /*
     IMPORTANT:
     JSONP request to Apps Script
  */

  script.src =
    APPS_SCRIPT_URL +
    "?action=result" +
    "&jobId=" +
    encodeURIComponent(
      jobId
    ) +
    "&callback=" +
    encodeURIComponent(
      callbackName
    ) +
    "&t=" +
    Date.now();


  script.async =
    true;


  window[callbackName] =
    function(response) {

      if (finished) {
        return;
      }


      finished =
        true;


      console.log(
        "Polling response:",
        response
      );


      cleanup();


      if (
        !response
      ) {

        return;
      }


      if (
        !response.ready
      ) {

        return;
      }


      if (pollingTimer) {

        clearInterval(
          pollingTimer
        );

        pollingTimer =
          null;
      }


      if (
        response.result &&
        response.result.success
      ) {

        showTranscript(
          response.result.transcript
        );

      } else {

        const errorMessage =
          response.result &&
          response.result.error
            ? response.result.error
            : "Transcription failed.";


        setStatus(
          "Error: " +
          errorMessage
        );
      }
    };


  script.onerror =
    function() {

      if (finished) {
        return;
      }


      finished =
        true;


      console.warn(
        "Polling request failed. Retrying..."
      );


      cleanup();
    };


  function cleanup() {

    try {

      delete window[
        callbackName
      ];

    } catch (error) {}


    if (
      script.parentNode
    ) {

      script.parentNode
        .removeChild(
          script
        );
    }
  }


  document
    .head
    .appendChild(
      script
    );
}


/* =====================================================
   SHOW TRANSCRIPT
   ===================================================== */

function showTranscript(
  transcript
) {

  console.log(
    "FINAL TRANSCRIPT:",
    transcript
  );


  const box =
    document.getElementById(
      "conversationBox"
    );


  if (!box) {
    return;
  }


  box.textContent =
    transcript ||
    "No conversation detected.";


  setStatus(
    "✅ Conversation saved successfully."
  );
}


/* =====================================================
   STATUS
   ===================================================== */

function setStatus(
  message
) {

  const status =
    document.getElementById(
      "status"
    );


  if (status) {

    status.textContent =
      message;
  }


  console.log(
    "STATUS:",
    message
  );
}


/* =====================================================
   SAFETY: STOP RECORDING WHEN PAGE CLOSES
   ===================================================== */

window.addEventListener(
  "beforeunload",
  function() {

    if (
      recordingStream
    ) {

      recordingStream
        .getTracks()
        .forEach(
          function(track) {

            track.stop();
          }
        );
    }
  }
);

</script>

</body>
</html>
